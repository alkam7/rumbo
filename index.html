<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rumbo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="color-scheme" content="dark">
<meta name="description" content="Organiza tu día por bloques: gym, clases, trabajo y descanso. Con recordatorios.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"InterR";src:url("fonts/inter.woff2") format("woff2");font-weight:400 800;font-display:swap}
/* Midnight: negro profundo con luces de color de fondo, tarjetas de vidrio, actividades en degradados que brillan, letra tipo Apple, íconos 3D. */
:root{
  color-scheme:dark;
  --bg:#09090B; --ink:#F4F4F5; --muted:#9A9AA5; --dim:#6E6E79;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.085); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --sheet:#111114; --danger:#FF6B6B; --ok:#3EE0B0;
  /* letra tipo Apple: SF Pro en iPhone/Mac; en Android, Inter (la más parecida y de uso libre) */
  --f:-apple-system, BlinkMacSystemFont, "SF Pro Text", "InterR", "Helvetica Neue", system-ui, sans-serif;
  --fd:-apple-system, BlinkMacSystemFont, "SF Pro Display", "InterR", "Helvetica Neue", system-ui, sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
.t-gym{--g1:#FF8A5B;--g2:#E8381F;--on:#fff}
.t-clase{--g1:#9D84FF;--g2:#5B3BE8;--on:#fff}
.t-trabajo{--g1:#FFC94D;--g2:#F08C00;--on:#1E1300}
.t-estudio{--g1:#5AA9FF;--g2:#1F6FE0;--on:#fff}
.t-leer{--g1:#3EE0B0;--g2:#0E9F77;--on:#03241A}
.t-correr{--g1:#FF6FA5;--g2:#E0245E;--on:#fff}
.t-meditar{--g1:#46DCEC;--g2:#0891A6;--on:#032A30}
.t-proyecto{--g1:#F0F0F2;--g2:#A1A1AA;--on:#111114}
.t-despertar{--g1:#FFE08A;--g2:#FFA94D;--on:#2A1700}
.t-dormir{--g1:#7B89FF;--g2:#2E3A9C;--on:#fff}
.t-otro{--g1:#B4B4BE;--g2:#5A5A66;--on:#fff}
[class*="t-"]{--grad:linear-gradient(150deg,var(--g1),var(--g2))}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top, 0px)}
body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;pointer-events:none}
body::before{left:-160px;top:-200px;width:520px;height:520px;background:radial-gradient(circle,rgba(120,80,255,.30),rgba(120,80,255,0) 65%)}
body::after{right:-200px;top:38%;width:480px;height:480px;background:radial-gradient(circle,rgba(255,90,54,.17),rgba(255,90,54,0) 65%)}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--fd);letter-spacing:-.028em}
.muted{color:var(--muted)}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:14px 130px}
h1,h2,h3{margin:0;text-wrap:balance}
.glass{background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}

/* entrada animada */
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:var(--c0)}}
@keyframes fillw{from{width:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.anim .st{animation:up .55s var(--ease) both}
.anim .st:nth-child(1){animation-delay:.02s}.anim .st:nth-child(2){animation-delay:.07s}.anim .st:nth-child(3){animation-delay:.12s}.anim .st:nth-child(4){animation-delay:.17s}.anim .st:nth-child(5){animation-delay:.22s}.anim .st:nth-child(6){animation-delay:.27s}.anim .st:nth-child(7){animation-delay:.32s}.anim .st:nth-child(n+8){animation-delay:.36s}

/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:17px 22px;border-radius:999px;font-weight:700;font-size:16.5px;background:#fff;color:#09090B;width:100%;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{padding:11px 16px;font-size:14.5px;width:auto}
.btn.danger{background:rgba(255,107,107,.1);color:var(--danger);border:1px solid rgba(255,107,107,.25)}
.btn.glow{background:linear-gradient(150deg,#FF7A50,#C9241A);color:#fff;box-shadow:0 0 30px -8px #FF4D2E}
.link{font-weight:600;font-size:14.5px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:4px;padding:6px 2px}

/* cabecera Hoy */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:4px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.top h1{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.028em;margin-top:7px}
.ringbox{position:relative;width:78px;height:78px;flex:none}
.ringbox svg{width:78px;height:78px;transform:rotate(-90deg)}
.ringbox .v{filter:drop-shadow(0 0 6px #FF6A45)}
.anim .ringbox .v{animation:ring 1.3s var(--ease) both}
.ringbox b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 18px/1 var(--fd)}
.ringbox b small{font:600 9.5px var(--f);letter-spacing:.08em;color:var(--muted);margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:6px;border-radius:24px;margin:18px 0 14px}
.week button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 8px;border-radius:17px;font-size:11.5px;font-weight:600;color:var(--dim);transition:background .2s}
.week button b{font:700 17px var(--fd);color:#E4E4E7}
.week button i{width:4px;height:4px;border-radius:50%;margin-top:3px}
.week button i.some{background:#71717A}.week button i.full{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.week button.today:not([aria-current]) b{color:#FF8A5B}
.week button[aria-current="date"]{background:#fff;color:#71717A}
.week button[aria-current="date"] b{color:#09090B}

/* bloques */
.blocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.row{position:relative;display:flex;align-items:center;border-radius:24px;transition:transform .15s var(--ease), opacity .25s}
.row:active{transform:scale(.985)}
.row .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 4px 12px 12px;text-align:left}
.row .tm{width:50px;flex:none;font:700 15.5px/1 var(--fd);letter-spacing:-.02em}
.row .tm small{display:block;font:600 10px var(--f);color:var(--dim);margin-top:3px;letter-spacing:.04em}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--grad);color:var(--on);box-shadow:0 6px 16px -8px var(--g2)}
.row .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.row .txt b{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.row .txt span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tick{flex:none;width:40px;height:40px;margin-right:8px;border-radius:50%;display:grid;place-items:center;color:transparent}
.tick span{width:26px;height:26px;border-radius:50%;border:2px solid #3A3A42;display:grid;place-items:center;transition:all .2s var(--ease)}
.tick svg{width:14px;height:14px;stroke-width:3.2}
.row.done{opacity:.5}
.row.done .tick span{background:#fff;border-color:#fff;color:#09090B;animation:pop .35s var(--ease)}
.row.done .txt b{text-decoration:line-through;text-decoration-color:var(--dim)}
.now{position:relative;overflow:hidden;border-radius:30px;padding:18px 18px 16px;background:var(--grad);color:var(--on);box-shadow:0 0 50px -14px var(--g2);text-align:left;display:flex;flex-direction:column;width:100%}
.now::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.32),rgba(255,255,255,0) 70%);pointer-events:none}
.now .lab{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.12em;background:rgba(0,0,0,.18);padding:5px 11px;border-radius:999px}
.now .lab i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.8s infinite}
.now h2{font:700 34px/1 var(--fd);letter-spacing:-.028em;margin:12px 0 5px;overflow-wrap:anywhere}
.now .meta{font-size:14px;opacity:.9}
.now .pb{height:7px;border-radius:4px;background:rgba(0,0,0,.2);margin-top:14px;overflow:hidden}
.now .pb u{display:block;height:100%;border-radius:4px;background:currentColor}
.anim .now .pb u{animation:fillw 1.1s .25s var(--ease) both}
.now .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:13px;font-weight:500}
.now .done-btn{position:relative;z-index:1;font-weight:700;font-size:13.5px;padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.2);color:inherit}
.nowline{display:flex;align-items:center;gap:8px;font:700 12px var(--fd);color:#FF6A45;padding:0 8px}
.nowline i{flex:1;height:1.5px;background:linear-gradient(90deg,#FF6A45,rgba(255,106,69,0))}
.next{display:flex;align-items:center;gap:10px;border-radius:20px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.next .pill{margin-left:auto;background:#fff;color:#09090B;font-size:13px;font-weight:700;border-radius:999px;padding:5px 11px;white-space:nowrap}
.empty{border-radius:28px;padding:30px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font:700 24px var(--fd);letter-spacing:-.03em}
.banner{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;border-radius:26px;padding:18px;margin-bottom:12px;background:linear-gradient(150deg,rgba(157,132,255,.22),rgba(91,59,232,.12));border:1px solid rgba(157,132,255,.32)}
.banner p{margin:0;font-size:15px;line-height:1.45;color:#E4E1FF}
.skipped{margin-top:12px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:0 6px}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(14px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));pointer-events:none}
.nav::before{content:"";position:absolute;inset:-30px 0 0;background:linear-gradient(180deg,rgba(9,9,11,0),rgba(9,9,11,.92) 55%);pointer-events:none}
.nav .in{position:relative;max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;pointer-events:auto}
.nav .tabs{flex:1;display:grid;grid-template-columns:repeat(3,1fr);border-radius:999px;padding:6px;background:rgba(30,30,36,.75);border:1px solid var(--line2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.nav .tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:999px;font-size:11px;font-weight:600;color:var(--dim);transition:all .2s}
.nav .tabs button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
.nav .tabs svg{width:21px;height:21px}
.fab{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#FF7A50,#C9241A);box-shadow:0 0 28px -6px #FF4D2E;transition:transform .15s var(--ease)}
.fab:active{transform:scale(.92)}
.fab svg{width:27px;height:27px;stroke-width:2.6}

/* hoja inferior */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:32px 32px 0 0;border-top:1px solid var(--line2);transform:translateY(100%);transition:transform .32s var(--ease);padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet.open{transform:none}
.sheet .head{position:relative;overflow:hidden;background:var(--grad, #1A1A20);color:var(--on, #fff);padding:12px max(20px, env(safe-area-inset-right, 0px)) 22px max(20px, env(safe-area-inset-left, 0px))}
.sheet .head::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 70%);pointer-events:none}
.sheet .head .in{position:relative;z-index:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:currentColor;opacity:.35;margin:0 auto}
.head .row1{display:flex;align-items:center;gap:13px}
.head .hic{width:54px;height:54px;border-radius:18px;background:rgba(0,0,0,.16);display:grid;place-items:center;flex:none}
.head .hic svg{width:27px;height:27px}
.head h2{font:700 28px/1.02 var(--fd);letter-spacing:-.028em}
.head .sub{font-size:14px;opacity:.88;margin-top:4px}
.head .edit{margin-left:auto;align-self:flex-start;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.18)}
.sheet .body{max-width:520px;margin:0 auto;padding:20px max(20px, env(safe-area-inset-right, 0px)) 26px max(20px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:17px;font-weight:700}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:10px 15px;border-radius:999px;font-size:14.5px;font-weight:600;background:var(--card);border:1px solid var(--line);color:#D4D4D8;transition:all .15s}
.chips button[aria-pressed="true"]{background:#fff;color:#09090B;border-color:#fff}
.chips button.add{border-style:dashed;color:var(--muted);background:transparent}
.list{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.li{display:flex;align-items:center;gap:13px;padding:13px 15px;min-height:54px}
.li+.li{border-top:1px solid var(--line)}
.li label{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.li.ok label{color:var(--dim);text-decoration:line-through}
.li input[type="text"]{flex:1;min-width:0;border:0;background:transparent;padding:4px 0;outline:none;font-weight:500}
.cb{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border-radius:9px;border:2px solid #3A3A42;display:grid;place-items:center;margin:0;background:transparent;transition:all .15s}
.cb:checked{background:var(--grad, #fff);border-color:transparent;box-shadow:0 0 12px -3px var(--g2, #fff)}
.cb:checked::after{content:"";width:11px;height:6px;border:3px solid var(--on, #09090B);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.field{display:flex;flex-direction:column;gap:7px}
.field>span{font-size:14px;font-weight:600;color:#D4D4D8}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 15px;outline:none;font-weight:500}
.field input:focus,.field textarea:focus{border-color:rgba(255,255,255,.4)}
.field textarea{min-height:90px;resize:vertical}
.prog{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.prog u{display:block;height:100%;border-radius:4px;background:var(--grad, #fff);box-shadow:0 0 10px var(--g2);transition:width .3s var(--ease)}
.info{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14.5px;color:var(--muted)}
.info b{color:var(--ink)}
.focus{display:flex;align-items:center;gap:12px;border-radius:22px;padding:14px 16px;background:var(--card);border:1px solid var(--line)}
.focus .clock{font:700 34px var(--fd);letter-spacing:-.03em;flex:1;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px}
.warn{display:flex;gap:8px;align-items:center;font-size:13.5px;color:#FFB4A6;font-weight:600;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.22);border-radius:14px;padding:9px 12px}

/* selector de días / horas / duración */
.q{border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q h3{font-size:16px;font-weight:600}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--card2);color:#B9B9C3}
.presets button[aria-pressed="true"]{background:#fff;color:#09090B}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:11px 0;border-radius:14px;font-weight:700;font-size:14px;background:var(--card2);color:var(--dim);transition:all .15s}
.days button[aria-pressed="true"]{background:var(--grad, linear-gradient(150deg,#9D84FF,#6A45F5));color:var(--on, #fff);box-shadow:0 0 16px -5px var(--g2, #6A45F5)}
.tstrip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 40%;margin:0 -16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.tstrip::-webkit-scrollbar{display:none}
.tstrip button{flex:none;scroll-snap-align:center;width:74px;text-align:center;padding:13px 0;border-radius:18px;font:700 20px/1 var(--fd);letter-spacing:-.02em;color:#5F5F69;background:var(--card);transition:all .18s var(--ease)}
.tstrip button small{display:block;font:600 10px var(--f);letter-spacing:.06em;margin-top:4px}
.tstrip button[aria-pressed="true"]{background:#fff;color:#09090B;transform:scale(1.07)}
.dur{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dur button{text-align:center;padding:11px 0;border-radius:14px;font-weight:700;font-size:14px;background:var(--card2);color:#A9A9B3;transition:all .15s}
.dur button[aria-pressed="true"]{background:var(--grad, linear-gradient(150deg,#9D84FF,#6A45F5));color:var(--on, #fff);box-shadow:0 0 16px -5px var(--g2, #6A45F5)}
.summary{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:#E4E1FF;background:rgba(106,69,245,.16);border:1px solid rgba(157,132,255,.28);border-radius:16px;padding:11px 14px}
.summary svg{width:18px;height:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:10px 6px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);transition:all .15s}
.seg button[aria-pressed="true"]{background:#fff;color:#09090B}
.dtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.dtabs::-webkit-scrollbar{display:none}
.dtabs button{flex:none;min-width:62px;padding:9px 10px;border-radius:16px;background:var(--card2);text-align:center;color:var(--muted);font-size:12px;font-weight:600;border:1px solid transparent}
.dtabs button b{display:block;font:700 15px var(--fd);color:#E4E4E7}
.dtabs button[aria-pressed="true"]{border-color:#fff;background:rgba(255,255,255,.1)}

/* semana */
.page-h{padding-top:4px;margin-bottom:18px}
.page-h h1{font:700 34px/1 var(--fd);letter-spacing:-.028em}
.page-h p{margin:7px 0 0;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{position:relative;overflow:hidden;border-radius:26px;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;background:var(--grad);color:var(--on);box-shadow:0 0 34px -16px var(--g2)}
.stat::after{content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),rgba(255,255,255,0) 70%)}
.stat b{font:700 36px/1 var(--fd);letter-spacing:-.03em}
.stat span{font-size:13.5px;font-weight:500;opacity:.9}
.days-list{margin-top:12px;display:flex;flex-direction:column;border-radius:26px;overflow:hidden}
.dayrow{display:grid;grid-template-columns:58px 1fr 38px;gap:10px;align-items:center;padding:14px 16px;text-align:left;width:100%}
.dayrow+.dayrow{border-top:1px solid var(--line)}
.dayrow .nm{font:700 16px var(--fd)}
.dayrow .nm small{display:block;font:500 12px var(--f);color:var(--dim)}
.segs{display:flex;gap:4px;min-width:0}
.segs i{flex:1;height:12px;border-radius:5px;background:var(--card2)}
.segs i.on{background:var(--grad);box-shadow:0 0 8px -2px var(--g2)}
.dayrow .ct{font-size:14px;font-weight:700;color:var(--muted);text-align:right}
.dayrow.is-today .nm{color:#FF8A5B}

/* tú */
.lib-sec{margin-bottom:22px;display:flex;flex-direction:column;gap:10px}
.lib-sec .hd{display:flex;align-items:center;justify-content:space-between}
.lib-sec h3{font:700 20px var(--fd);letter-spacing:-.02em}
.item{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:13px 15px;color:inherit;text-decoration:none}
.item+.item{border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:600}
.item .grow span{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.item .chev{width:18px;height:18px;color:#52525B}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:31px;border-radius:16px;background:#3A3A42;position:relative;flex:none;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:left .22s var(--ease)}
.switch:checked{background:var(--ok);box-shadow:0 0 14px -4px var(--ok)}
.switch:checked::after{left:24px}

/* bienvenida */
.ob{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top, 0px)}
.ob::before{content:"";position:fixed;left:-160px;top:-200px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(120,80,255,.32),rgba(120,80,255,0) 65%);pointer-events:none}
.ob::after{content:"";position:fixed;right:-200px;bottom:-100px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,54,.18),rgba(255,90,54,0) 65%);pointer-events:none}
.ob .in{position:relative;z-index:1;max-width:520px;min-height:100%;margin:0 auto;padding:16px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.ob .topbar{display:flex;align-items:center;gap:12px;min-height:40px}
.ob .back{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ob .bar{flex:1;height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
.ob .bar u{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#9D84FF,#FF6A45);transition:width .4s var(--ease)}
.ob .count{font-size:13px;font-weight:600;color:var(--muted)}
.ob h1{font:700 36px/1 var(--fd);letter-spacing:-.03em}
.ob .lead{font-size:16.5px;color:var(--muted);margin:0;line-height:1.45}
.ob .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:8px}
.ob .titlerow{display:flex;align-items:center;gap:13px}
.ob .titlerow .ic{width:50px;height:50px;border-radius:17px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:24px;padding:15px;height:106px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-weight:600;font-size:16.5px;background:var(--card);border:1px solid var(--line);color:#D4D4D8;transition:transform .15s var(--ease), background .2s}
.tile:active{transform:scale(.96)}
.tile .ic{width:50px;height:50px;border-radius:16px}
.tile.on{background:var(--grad);color:var(--on);border-color:transparent;box-shadow:0 0 30px -12px var(--g2)}
.tile.on .ic{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3)}
.tile .tk{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:#fff;color:#09090B;display:none;place-items:center}
.tile.on .tk{display:grid;animation:pop .3s var(--ease)}
.tile .tk svg{width:14px;height:14px;stroke-width:3.2}
.hero-logo{width:86px;height:86px;border-radius:28px;background:linear-gradient(150deg,#FF7A50,#C9241A);color:#fff;display:grid;place-items:center;margin-top:26px;box-shadow:0 0 50px -10px #FF4D2E}
.hero-logo svg{width:46px;height:46px}
.welcome{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.welcome .row{pointer-events:none}
.ob input.name{border:0;border-bottom:2px solid var(--line2);background:transparent;font:700 30px var(--fd);letter-spacing:-.03em;padding:10px 0;outline:none;width:100%;border-radius:0;color:var(--ink)}
.ob input.name:focus{border-color:#fff}
.sleepnote{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--muted)}
.sleepnote b{color:var(--ink)}

/* tarjeta de logro */
.cheer{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top, 0px));z-index:70;display:flex;justify-content:center;padding:0 16px;pointer-events:none;opacity:0;transform:translateY(-24px) scale(.96);transition:opacity .35s var(--ease),transform .45s var(--ease)}
.cheer.show{opacity:1;transform:none;pointer-events:auto}
.cheer-card{width:100%;max-width:440px;display:flex;align-items:center;gap:14px;padding:14px 18px 14px 14px;border-radius:28px;color:#fff;
  background:linear-gradient(165deg,rgba(60,52,80,.78),rgba(22,20,30,.86)) padding-box,linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.06) 40%,rgba(255,140,90,.4)) border-box;border:1px solid transparent;
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 24px 50px -18px rgba(0,0,0,.9),0 0 40px -18px #FF4D2E}
.cheer-card.full{background:linear-gradient(150deg,#FF8A5B,#E8381F) padding-box,linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,.1)) border-box;box-shadow:0 0 60px -12px #FF4D2E}
.cring{position:relative;width:70px;height:70px;flex:none}
.cring svg{width:70px;height:70px;transform:rotate(-90deg)}
.cring .v{transition:stroke-dashoffset .9s var(--ease);filter:drop-shadow(0 0 5px #FF6A45)}
.cheer-card.full .cring .v{stroke:#fff;filter:none}
.cring b{position:absolute;inset:0;display:grid;place-items:center;font:700 17px var(--fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ctext{min-width:0;display:flex;flex-direction:column;gap:2px}
.ctext .ct{font:700 18px var(--fd);letter-spacing:-.02em}
.ctext p{margin:0;font-size:14.5px;line-height:1.35;opacity:.92}
.ctext small{font-size:12px;opacity:.65;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:#fff;color:#09090B;padding:12px 18px;border-radius:999px;font-size:14.5px;font-weight:600;transition:all .25s var(--ease);pointer-events:none;max-width:calc(100% - 40px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ===== vidrio premium ===== */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(10px);opacity:.9;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-25%;top:-12%;width:80vw;height:80vw;max-width:560px;max-height:560px;background:radial-gradient(circle,rgba(124,92,255,.42),rgba(124,92,255,0) 65%)}
.aurora i:nth-child(2){right:-30%;top:30%;width:85vw;height:85vw;max-width:600px;max-height:600px;background:radial-gradient(circle,rgba(255,96,60,.28),rgba(255,96,60,0) 65%);animation-duration:26s;animation-delay:-8s}
.aurora i:nth-child(3){left:-20%;bottom:-18%;width:75vw;height:75vw;max-width:520px;max-height:520px;background:radial-gradient(circle,rgba(40,200,190,.22),rgba(40,200,190,0) 65%);animation-duration:30s;animation-delay:-15s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(6vw,4vh) scale(1.12)}}
body::before,body::after{display:none}
.glass,.list,.focus,.q,.days-list,.tile:not(.on),.field input,.field textarea,.next,.empty{
  background:
    linear-gradient(165deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.04) 45%,rgba(255,255,255,.065) 100%) padding-box,
    linear-gradient(145deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.07) 30%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.18) 100%) border-box;
  border:1px solid transparent;
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -1px 0 rgba(255,255,255,.03),0 18px 40px -22px rgba(0,0,0,.9);
}
.field input:focus,.field textarea:focus{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px rgba(255,255,255,.35)}
.nav .tabs{background:linear-gradient(165deg,rgba(60,60,70,.55),rgba(25,25,30,.6)) padding-box,linear-gradient(145deg,rgba(255,255,255,.35),rgba(255,255,255,.05) 40%,rgba(255,255,255,.15)) border-box;border:1px solid transparent;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 20px 40px -20px #000}
.sheet{background:linear-gradient(180deg,rgba(28,28,34,.92),rgba(14,14,18,.97));-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%)}
/* íconos 3D sobre una placa de vidrio teñida con el color de la actividad */
.ic{background:
    radial-gradient(120% 100% at 30% 0%,rgba(255,255,255,.22),rgba(255,255,255,.02) 60%),
    linear-gradient(150deg,color-mix(in srgb,var(--g1) 38%,transparent),color-mix(in srgb,var(--g2) 26%,transparent));
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -10px var(--g2)}
.e3d{width:31px;height:31px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));-webkit-user-drag:none;pointer-events:none}
.tile .e3d{width:36px;height:36px}
.head .hic{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.head .hic .e3d{width:36px;height:36px}
.ob .titlerow .e3d{width:32px;height:32px}
.now .lab,.head .edit,.now .done-btn{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.top h1,.page-h h1,.ob h1,.now h2,.head h2{font-weight:700}
body{font-feature-settings:"kern","calt"}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app" id="app"></div>

<nav class="nav" id="nav" aria-label="Secciones" hidden>
  <div class="in">
    <div class="tabs">
      <button data-view="hoy" aria-current="page"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Hoy</button>
      <button data-view="semana"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>Semana</button>
      <button data-view="tu"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>Tú</button>
    </div>
    <button class="fab" id="fab" data-new aria-label="Agregar actividad"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>

<div class="toast" id="toast" role="status"></div>
<div class="cheer" id="cheer" role="status" aria-live="polite" hidden></div>

<script>
/* ---------- catálogo ---------- */
const IC = {
  gym:'<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
  clase:'<path d="M3 8.5 12 4l9 4.5-9 4.5z"/><path d="M7 10.5V15c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5M21 8.5v5"/>',
  trabajo:'<rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V5.5h6v2M3.5 12.5h17"/>',
  estudio:'<path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11M9 8.5h6"/>',
  leer:'<path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1V19c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6.5V20"/>',
  correr:'<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
  meditar:'<circle cx="12" cy="6" r="2.5"/><path d="M4 17c2.5-.5 4-2 5-5h6c1 3 2.5 4.5 5 5M7 20.5h10"/>',
  proyecto:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',
  despertar:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>',
  dormir:'<path d="M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z"/>',
  otro:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'
};
const LABEL = {gym:'Gym', clase:'Clases', trabajo:'Trabajo', estudio:'Estudiar', leer:'Leer', correr:'Correr', meditar:'Meditar', proyecto:'Proyecto personal', despertar:'Despertar', dormir:'Dormir', otro:'Otra cosa'};
const ALL = [0,1,2,3,4,5,6], LV = [1,2,3,4,5];
const CATALOG = [
  {k:'gym', start:'07:00', end:'08:30', days:[1,2,3,4,5,6]},
  {k:'clase', start:'08:00', end:'12:00', days:LV},
  {k:'trabajo', start:'14:00', end:'19:00', days:LV},
  {k:'estudio', start:'20:00', end:'21:00', days:LV},
  {k:'leer', start:'22:00', end:'22:30', days:ALL},
  {k:'correr', start:'06:30', end:'07:00', days:[1,3,5]},
  {k:'meditar', start:'06:45', end:'07:00', days:ALL},
  {k:'proyecto', start:'21:00', end:'22:00', days:LV},
  {k:'otro', start:'18:00', end:'19:00', days:LV}
];
const GOAL = {estudio:['¿Qué vas a estudiar?','Ej. Repasar el capítulo 4'], leer:['¿Qué vas a leer?','Ej. Hábitos atómicos, 20 páginas'], correr:['Meta de hoy','Ej. 5 km o 30 minutos'], meditar:['Intención de hoy','Ej. Calmar la mente antes de clases'], proyecto:['¿Qué vas a avanzar?','Ej. Terminar el logo'], otro:['Objetivo de este bloque','Ej. Ordenar el cuarto']};
const FOCUS_TYPES = ['clase','trabajo','estudio','leer','proyecto','otro'];
const SLEEP_CHECKS = ['Sin pantallas 30 min antes','Ropa y mochila listas para mañana','Revisé mi agenda de mañana','Alarma puesta'];
const WAKE_CHECKS = ['Tomar un vaso de agua','Tender la cama','Revisar mi plan del día'];
const TEMPLATES = [
  {name:'Empuje', ex:['Press de banca 4×8','Press militar 3×10','Fondos 3×12','Extensión de tríceps 3×12']},
  {name:'Jalón', ex:['Dominadas 4×6','Remo con barra 4×8','Face pull 3×15','Curl de bíceps 3×12']},
  {name:'Pierna', ex:['Sentadilla 4×6','Peso muerto rumano 3×10','Zancadas 3×12','Pantorrilla 4×15']},
  {name:'Full body', ex:['Sentadilla 3×8','Press de banca 3×8','Remo 3×10','Plancha 3×40 s']},
  {name:'Cardio', ex:['Calentamiento 5 min','Intervalos 20 min','Estiramiento 10 min']}
];
const DL = ['D','L','M','X','J','V','S'], ORDER = [1,2,3,4,5,6,0];
const DN = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg class="i chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
const CLOCK = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const REMIND_OPTS = [[null,'Sin aviso'],[0,'A la hora'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[30,'30 min']];
const DURS = [15,30,45,60,90,120,180,240,300,360,480,600];
const PRESETS = [['Lun a Vie',[1,2,3,4,5]],['Todos',ALL],['Lun a Sáb',[1,2,3,4,5,6]],['Fin de semana',[6,0]]];
/* horas cada 30 min, empezando a las 4:00 a. m. para que la mañana salga primero */
const SLOTS = Array.from({length:48}, (_,i) => { const m = (240 + i*30) % 1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); });

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
/* íconos 3D: Fluent Emoji de Microsoft (licencia MIT, ver img/LICENSE-fluent-emoji.txt) */
const ico = t => '<img class="e3d" src="img/'+(IC[t]?t:'otro')+'.png" alt="" draggable="false">';
const icBox = t => '<span class="ic t-'+t+'">'+ico(t)+'</span>';
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const toMin = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const fromMin = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => addDays(dayOnly(d), -((d.getDay()+6)%7));
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const isToday = d => dkey(d) === dkey(new Date());
function fmtT(t){ const m = toMin(t); let h = Math.floor(m/60); const mm = m%60, p = h < 12 ? 'a. m.' : 'p. m.'; h = h%12 || 12; return {t: h+':'+String(mm).padStart(2,'0'), p, P: p === 'a. m.' ? 'AM' : 'PM'}; }
const fmtFull = t => { const f = fmtT(t); return f.t+' '+f.p; };
function durMin(a){ let s = toMin(a.start), e = toMin(a.end); if (e <= s) e += 1440; return e - s; }
function fmtDur(m){ m = Math.max(0, Math.round(m)); const h = Math.floor(m/60), r = m%60; if (!h) return r+' min'; return h+' h'+(r ? ' '+r : ''); }
function greet(){ const h = new Date().getHours(); return h < 5 ? 'Buenas noches' : h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }
function daysText(ds){
  const s = ds.slice().sort().join(',');
  if (s === '0,1,2,3,4,5,6') return 'Todos los días';
  if (s === '1,2,3,4,5') return 'Lun a Vie';
  if (s === '1,2,3,4,5,6') return 'Lun a Sáb';
  if (s === '0,6') return 'Fin de semana';
  return ORDER.filter(d => ds.includes(d)).map(d => cap(DN[d]).slice(0,3)).join(', ');
}

/* ---------- estado ---------- */
const LS = 'rumbo-agenda-v1';
function blank(){ return {v:3, onboarded:false, name:'', activities:[], routines:[], classes:[], log:{}}; }
let S = (() => { try { const r = localStorage.getItem(LS); if (r){ const o = JSON.parse(r); if (o && o.onboarded) return o; } } catch(e){} return blank(); })();
function save(){
  const cutoff = dkey(addDays(new Date(), -120));
  for (const k of Object.keys(S.log)) if (k < cutoff) delete S.log[k];
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  if (S.remindOn){ clearTimeout(save.t); save.t = setTimeout(scheduleAll, 1500); }
}
const entry = (d,id) => { const k = dkey(d); S.log[k] ??= {}; S.log[k][id] ??= {}; return S.log[k][id]; };
const peek = (d,id) => (S.log[dkey(d)] || {})[id] || {};
function slot(a, wd){ const t = a.vary && a.times && a.times[wd]; return t ? {start:t.start, end:t.end} : {start:a.start, end:a.end}; }
function inst(a, date){ const e = peek(date, a.id), s = e.time || slot(a, date.getDay()); return {...a, start:s.start, end:s.end, moved:!!e.time}; }
const actsFor = d => S.activities.filter(a => a.days.includes(d.getDay()) && !peek(d,a.id).skip).map(a => inst(a,d)).sort((a,b) => toMin(a.start) - toMin(b.start));
const skippedFor = d => S.activities.filter(a => a.days.includes(d.getDay()) && peek(d,a.id).skip);
const actById = id => S.activities.find(a => a.id === id);
const routine = id => S.routines.find(r => r.id === id);
const klass = id => S.classes.find(c => c.id === id);
function dayStats(d){ const acts = actsFor(d); return {total: acts.length, done: acts.filter(a => peek(d,a.id).done).length}; }
function isNow(a){ const n = nowMin(), s = toMin(a.start); let e = toMin(a.end); if (e <= s) e += 1440; return n >= s && n < e; }
const routineOf = (d,a) => routine(peek(d,a.id).routineId || a.pref?.routineId);
const classOf = (d,a) => klass(peek(d,a.id).classId || a.pref?.classId);
function fillTimes(o){ o.times ??= {}; for (const d of o.days) o.times[d] ??= {start:o.start, end:o.end}; }
/* deja los horarios por día limpios: solo los días elegidos; si todos son iguales, vuelve a "mismo horario" */
function normalizeTimes(o){
  if (o.vary){
    fillTimes(o); const t = {}; for (const d of o.days) t[d] = o.times[d]; o.times = t;
    const first = o.times[ORDER.find(d => o.days.includes(d))]; o.start = first.start; o.end = first.end;
    if (Object.values(t).every(x => x.start === first.start && x.end === first.end)){ o.vary = false; delete o.times; }
  } else { delete o.times; o.vary = false; }
}

function subFor(d,a){
  const e = peek(d,a.id);
  if (e.done) return 'Hecho';
  if (a.type === 'gym'){ const r = routineOf(d,a); if (!r) return 'Toca para elegir tu rutina'; const n = r.ex.filter((_,i)=>e.ex?.[i]).length; return r.name + (n ? ' · '+n+'/'+r.ex.length : ''); }
  if (a.type === 'clase'){ const c = classOf(d,a); return c ? c.name + (c.room ? ' · '+c.room : '') : '¿En qué clase estás?'; }
  if (a.type === 'trabajo'){ const p = (e.prio||[]).filter(x => x && x.t); return p.length ? p.filter(x=>x.ok).length+' de '+p.length+' prioridades' : 'Define tus 3 prioridades'; }
  if (a.type === 'dormir'){ const n = SLEEP_CHECKS.filter((_,i)=>e.sl?.[i]).length; return 'Rutina de descanso' + (n ? ' · '+n+'/'+SLEEP_CHECKS.length : ''); }
  if (a.type === 'despertar'){ const n = WAKE_CHECKS.filter((_,i)=>e.wk?.[i]).length; return 'Rutina de mañana' + (n ? ' · '+n+'/'+WAKE_CHECKS.length : ''); }
  return e.goal || fmtDur(durMin(a)) + (a.moved ? ' · hora cambiada' : '');
}

/* ---------- selector de horario por toques ---------- */
/* tgt(ctx) devuelve el objeto {start,end} que se está editando según el contexto */
function tgt(ctx){
  const p = ctx.split('.');
  if (p[0] === 'obi'){ const it = obItem(p[1]); if (p[2] !== undefined){ fillTimes(it); return it.times[p[2]]; } return it; }
  if (p[0] === 'dr'){ const dr = sheet.draft; if (p[1] !== undefined){ fillTimes(dr); return dr.times[p[1]]; } return dr; }
  if (p[0] === 'once') return sheet.once;
  return null;
}
function timeStrip(ctx, value){
  return '<div class="tstrip" data-strip>'+SLOTS.map(s => { const f = fmtT(s); return '<button data-ts="'+ctx+'" data-v="'+s+'" aria-pressed="'+(s===value)+'" aria-label="'+fmtFull(s)+'">'+f.t+'<small>'+f.P+'</small></button>'; }).join('')+'</div>';
}
function durChips(ctx, o){
  const cur = durMin(o), list = DURS.includes(cur) ? DURS : DURS.concat(cur).sort((a,b)=>a-b);
  return '<div class="dur">'+list.map(m => '<button data-td="'+ctx+'" data-v="'+m+'" aria-pressed="'+(m===cur)+'">'+fmtDur(m)+'</button>').join('')+'</div>';
}
function scheduleBlock(ctx, o){
  return '<div class="q glass"><h3>¿A qué hora empieza?</h3>'+timeStrip(ctx, o.start)+'</div>'+
    '<div class="q glass"><h3>¿Cuánto dura?</h3>'+durChips(ctx, o)+'</div>';
}
function daysBlock(prefix, o){
  const cur = o.days.slice().sort().join(',');
  return '<div class="q glass"><h3>¿Qué días?</h3><div class="presets">'+PRESETS.map(([l,ds],i) => '<button data-preset="'+prefix+'" data-i="'+i+'" aria-pressed="'+(ds.slice().sort().join(',')===cur)+'">'+l+'</button>').join('')+'</div>'+
    '<div class="days">'+ORDER.map(d => '<button data-dday="'+prefix+'" data-d="'+d+'" aria-pressed="'+o.days.includes(d)+'" aria-label="'+DN[d]+'">'+DL[d]+'</button>').join('')+'</div></div>';
}
/* bloque completo de horario: misma hora o día por día (con pestañas de día) */
function fullSchedule(prefix, o, eday){
  if (!o.days.length) return '';
  let h = '<div class="seg"><button data-vary="'+prefix+'" data-v="0" aria-pressed="'+!o.vary+'">Misma hora</button><button data-vary="'+prefix+'" data-v="1" aria-pressed="'+!!o.vary+'">Cambia por día</button></div>';
  if (!o.vary){
    h += scheduleBlock(prefix, o) + '<div class="summary">'+CLOCK+daysText(o.days)+' · '+fmtT(o.start).t+' a '+fmtFull(o.end)+'</div>';
  } else {
    fillTimes(o); const ed = o.days.includes(eday) ? eday : ORDER.find(d => o.days.includes(d));
    h += '<div class="dtabs">'+ORDER.filter(d => o.days.includes(d)).map(d => '<button data-eday="'+prefix+'" data-d="'+d+'" aria-pressed="'+(d===ed)+'">'+cap(DN[d]).slice(0,3)+'<b>'+fmtT(o.times[d].start).t+'</b></button>').join('')+'</div>';
    h += '<div class="q glass" style="padding-bottom:6px"><h3>'+cap(DN[ed])+'</h3></div>';
    h += scheduleBlock(prefix+'.'+ed, o.times[ed]);
    h += '<div class="summary">'+CLOCK+cap(DN[ed])+' · '+fmtT(o.times[ed].start).t+' a '+fmtFull(o.times[ed].end)+'</div>';
    h += '<button class="btn ghost sm" style="width:100%" data-copyall="'+prefix+'" data-d="'+ed+'">Usar este horario para todos los días</button>';
  }
  return h;
}
function centerStrips(root){
  (root || document).querySelectorAll('[data-strip]').forEach(s => { const on = s.querySelector('[aria-pressed="true"]'); if (on) s.scrollLeft = on.offsetLeft - (s.clientWidth - on.clientWidth)/2; });
}

/* ---------- recordatorios ---------- */
const CAPX = window.Capacitor;
const NATIVE = !!(CAPX && CAPX.isNativePlatform && CAPX.isNativePlatform());
const LN = NATIVE ? CAPX.Plugins.LocalNotifications : null;
const AppP = NATIVE ? CAPX.Plugins.App : null;
const HAP = NATIVE ? CAPX.Plugins.Haptics : null;
const SB = NATIVE ? CAPX.Plugins.StatusBar : null;
const buzz = (s) => { try { HAP && HAP.impact({style: s || 'LIGHT'}); } catch(e){} };
let notif = {perm: NATIVE ? 'prompt' : 'web', exact: 'granted'};
async function refreshNotifState(){
  if (!LN) return;
  try { notif.perm = (await LN.checkPermissions()).display; } catch(e){}
  try { notif.exact = (await LN.checkExactNotificationSetting()).exact_alarm; } catch(e){ notif.exact = 'granted'; }
  if (!sheet && !ob) render();
}
async function enableReminders(){
  if (!LN){ exportICS(); return; }
  let p = notif.perm;
  try { if (p !== 'granted') p = (await LN.requestPermissions()).display; } catch(e){}
  notif.perm = p;
  if (p !== 'granted'){ toast('Permite las notificaciones de Rumbo en los ajustes del celular'); render(); return false; }
  S.remindOn = true; save(); await scheduleAll(); await refreshNotifState(); render();
  toast('Recordatorios activados'); return true;
}
function reminderText(a){
  if (a.type === 'gym'){ const r = routine(a.pref?.routineId); return r ? 'Hoy toca '+r.name+'. Prepara tu ropa y agua.' : 'Elige tu rutina y a darle.'; }
  if (a.type === 'clase'){ const c = klass(a.pref?.classId); return c ? c.name + (c.room ? ' · '+c.room : '') : 'Abre Rumbo y marca en qué clase estás.'; }
  return ({trabajo:'Antes de empezar, define tus 3 prioridades.', dormir:'Deja el celular, prepara lo de mañana y descansa.', despertar:'Buenos días. Toma agua y revisa tu plan del día.', estudio:'Hora de estudiar. Celular lejos.', leer:'Toca leer un rato.', correr:'Ponte las zapatillas.', meditar:'Unos minutos para ti.', proyecto:'Avanza tu proyecto, aunque sea un poco.'})[a.type] || 'Es hora de: '+a.title;
}
let scheduling = Promise.resolve();
function scheduleAll(){ scheduling = scheduling.then(doSchedule, doSchedule); return scheduling; }
async function doSchedule(){
  if (!LN) return;
  try {
    const pend = await LN.getPending();
    if (pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n => ({id:n.id}))});
    if (!S.remindOn || notif.perm !== 'granted') return;
    try { await LN.createChannel({id:'rumbo', name:'Recordatorios', description:'Avisos de tus actividades', importance:5, visibility:1, vibration:true}); } catch(e){}
    // avisos con fecha para los próximos 21 días: respetan horarios por día, cambios de un solo día y días quitados.
    const list = []; let nid = 1; const now = Date.now(), d0 = dayOnly(new Date());
    for (let i = 0; i < 21; i++){
      const d = addDays(d0, i);
      for (const a of actsFor(d)){
        if (a.remind === null || a.remind === undefined) continue;
        const at = new Date(d); at.setMinutes(toMin(a.start) - a.remind);
        if (at.getTime() <= now + 5000) continue;
        list.push({ id: nid++, channelId:'rumbo', title: a.remind ? 'En '+a.remind+' min: '+a.title : a.title+' · '+fmtFull(a.start),
          body: reminderText(a), schedule: { at, allowWhileIdle: true }, extra: { actId: a.id } });
      }
    }
    if (list.length) await LN.schedule({notifications: list});
  } catch(e){ console.error(e); toast('No se pudieron programar los avisos'); }
}
async function testReminder(){
  if (!LN){ toast('La prueba funciona en la app de Android'); return; }
  if (notif.perm !== 'granted'){ const ok = await enableReminders(); if (!ok) return; }
  try { await LN.createChannel({id:'rumbo', name:'Recordatorios', importance:5, visibility:1, vibration:true}); } catch(e){}
  await LN.schedule({notifications:[{id:99999, channelId:'rumbo', title:'Así se ve un recordatorio', body:'Rumbo te avisará antes de cada actividad.', schedule:{at:new Date(Date.now()+5000), allowWhileIdle:true}}]});
  toast('Llega en 5 segundos. Puedes bloquear el celular.');
}

/* ---------- versión web ---------- */
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(UA);
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const APK_URL = 'https://github.com/alkam7/rumbo/releases/latest/download/Rumbo.apk';
const icsEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const icsDT = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
function buildICS(){
  const BY = ['SU','MO','TU','WE','TH','FR','SA'];
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rumbo//Agenda//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Rumbo'];
  for (const a of S.activities){
    if (!a.days.length) continue;
    const groups = {};
    for (const d of a.days){ const s = slot(a,d), k = s.start+'-'+s.end; (groups[k] ??= {s, days:[]}).days.push(d); }
    Object.values(groups).forEach((g, gi) => {
      let first = dayOnly(new Date()); for (let i = 0; i < 7 && !g.days.includes(first.getDay()); i++) first = addDays(first,1);
      const s = new Date(first); s.setMinutes(toMin(g.s.start));
      const e = new Date(s.getTime() + durMin(g.s)*60000);
      L.push('BEGIN:VEVENT','UID:rumbo-'+a.id+'-'+gi+'@rumbo.app','DTSTAMP:'+stamp,'DTSTART:'+icsDT(s),'DTEND:'+icsDT(e),'RRULE:FREQ=WEEKLY;BYDAY='+g.days.map(d=>BY[d]).join(','),'SUMMARY:'+icsEsc(a.title),'DESCRIPTION:'+icsEsc(reminderText(a)));
      if (a.remind !== null && a.remind !== undefined) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(a.title),'TRIGGER:-PT'+a.remind+'M','END:VALARM');
      L.push('END:VEVENT');
    });
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
function exportICS(){
  const url = URL.createObjectURL(new Blob([buildICS()], {type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = 'rumbo-avisos.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  S.icsAt = Date.now(); save(); render();
  toast(IS_IOS ? 'Toca "Agregar todo" para guardarlos en Calendario' : 'Abre el archivo para agregarlo a tu calendario');
}
function banner(){
  if (NATIVE){
    if (!(S.remindOn && notif.perm === 'granted')) return '<div class="banner st"><p><b>Activa tus recordatorios.</b> Rumbo te avisa antes de cada actividad, aunque la app esté cerrada.</p><button class="btn sm" data-remind-on>Activar recordatorios</button></div>';
    if (notif.exact === 'denied') return '<div class="banner st"><p>Para que los avisos lleguen a la hora exacta, permite <b>alarmas y recordatorios</b> para Rumbo.</p><button class="btn sm" data-exact>Permitir</button></div>';
    return '';
  }
  if (IS_ANDROID && !STANDALONE) return '<div class="banner st"><p><b>¿Tienes Android?</b> Descarga la app: los recordatorios suenan aunque esté cerrada.</p><a class="btn sm" href="'+APK_URL+'" style="text-decoration:none">Descargar app para Android</a></div>';
  if (IS_IOS && !STANDALONE) return '<div class="banner st"><p><b>Instálala en tu iPhone.</b> En Safari toca <b>Compartir</b> y luego <b>Agregar a inicio</b>.</p></div>';
  if (!S.icsAt) return '<div class="banner st"><p><b>Activa tus avisos.</b> Rumbo pone tus actividades en el calendario del celular con alarma.</p><button class="btn sm" data-ics>Agregar avisos al calendario</button></div>';
  return '';
}

/* ---------- vistas ---------- */
let view = 'hoy', sel = dayOnly(new Date()), animNext = true;
function render(){
  if (!S.onboarded){ $('#app').innerHTML = ''; $('#nav').hidden = true; return; }
  $('#nav').hidden = false;
  document.querySelectorAll('.nav .tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  const app = $('#app');
  app.innerHTML = '<div class="'+(animNext?'anim':'')+'" style="display:flex;flex-direction:column">'+(view === 'hoy' ? viewHoy() : view === 'semana' ? viewSemana() : viewTu())+'</div>';
  animNext = false; tick();
}
function rowHtml(a, d){
  const e = peek(d,a.id), f = fmtT(a.start);
  return '<li class="row glass st t-'+a.type+(e.done?' done':'')+'"><button class="main" data-open="'+a.id+'"><span class="tm">'+f.t+'<small>'+f.P+'</small></span>'+icBox(a.type)+'<span class="txt"><b>'+esc(a.title)+'</b><span>'+esc(subFor(d,a))+'</span></span></button>'+
    '<button class="tick" data-done="'+a.id+'" aria-pressed="'+!!e.done+'" aria-label="Marcar '+esc(a.title)+' como hecha"><span>'+CHECK+'</span></button></li>';
}
function nowHtml(a, d){
  const s = toMin(a.start), dur = durMin(a); let el = nowMin() - s; if (el < 0) el += 1440;
  return '<li class="st"><div class="now t-'+a.type+'" role="button" tabindex="0" data-open="'+a.id+'"><span class="lab"><i></i>AHORA</span><h2>'+esc(a.title)+'</h2>'+
    '<div class="meta">'+fmtT(a.start).t+' – '+fmtFull(a.end)+' · '+esc(subFor(d,a))+'</div><div class="pb"><u style="width:'+Math.min(100, Math.round(el/dur*100))+'%"></u></div>'+
    '<div class="foot"><span>Quedan '+fmtDur(dur-el)+'</span><button class="done-btn" data-done="'+a.id+'">Marcar hecha</button></div></div></li>';
}
function viewHoy(){
  const acts = actsFor(sel), st = dayStats(sel), today = isToday(sel), n = nowMin();
  const ws = weekStart(sel), C = 2*Math.PI*48, pct = st.total ? st.done/st.total : 0;
  const week = [0,1,2,3,4,5,6].map(i => { const d = addDays(ws,i), s = dayStats(d);
    const dot = !s.total || !s.done ? '' : s.done === s.total ? 'full' : 'some';
    return '<button data-day="'+dkey(d)+'" class="'+(isToday(d)?'today':'')+'" '+(dkey(d)===dkey(sel)?'aria-current="date"':'')+'>'+DL[d.getDay()]+'<b>'+d.getDate()+'</b><i class="'+dot+'"></i></button>'; }).join('');
  let next = '';
  if (today){
    const cur = acts.find(a => isNow(a) && !peek(sel,a.id).done), nx = acts.find(a => toMin(a.start) > n);
    if (!cur && nx) next = '<div class="next glass st">Siguiente: <b>'+esc(nx.title)+'</b><span class="pill">en '+fmtDur(toMin(nx.start)-n)+'</span></div>';
  }
  let list = '', placed = !today;
  for (const a of acts){
    const now = today && isNow(a) && !peek(sel,a.id).done;
    if (!placed && toMin(a.start) > n){ list += '<li class="nowline st" aria-hidden="true">'+fmtT(fromMin(n)).t+'<i></i></li>'; placed = true; }
    list += now ? nowHtml(a, sel) : rowHtml(a, sel);
  }
  const sk = skippedFor(sel);
  const skHtml = sk.length ? '<div class="skipped">Quitaste de este día: '+sk.map(a => '<span><b>'+esc(a.title)+'</b> <button class="link" data-unskip="'+a.id+'">Devolver</button></span>').join('')+'</div>' : '';
  const title = today ? greet()+(S.name ? ',<br>'+esc(S.name) : '') : cap(DN[sel.getDay()]);
  return '<header class="top st"><div><div class="eyebrow">'+cap(DN[sel.getDay()])+' '+sel.getDate()+' de '+MN[sel.getMonth()]+'</div><h1>'+title+'</h1></div>'+
      '<div class="ringbox"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="48" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/><circle class="v" cx="55" cy="55" r="48" fill="none" stroke="#FF6A45" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'" style="--c0:'+C+'"/></svg><b>'+st.done+'/'+st.total+'<small>HECHAS</small></b></div></header>'+
    '<nav class="week glass st" aria-label="Días de la semana">'+week+'</nav>'+ banner() + next +
    (acts.length ? '<ol class="blocks">'+list+'</ol>' : '<div class="empty glass st"><h3>Día libre</h3><p class="muted" style="margin:0">No tienes nada el '+DN[sel.getDay()]+'. Agrega algo con el botón +.</p></div>') + skHtml;
}
function viewSemana(){
  const ws = weekStart(new Date()), we = addDays(ws,6); let tot = 0, done = 0, focus = 0, gym = 0;
  const rows = [0,1,2,3,4,5,6].map(i => { const d = addDays(ws,i), acts = actsFor(d), s = dayStats(d);
    tot += s.total; done += s.done;
    acts.forEach(a => { const e = peek(d,a.id); focus += e.focus||0; if (a.type === 'gym' && e.done) gym++; });
    const segs = acts.map(a => '<i class="t-'+a.type+(peek(d,a.id).done?' on':'')+'"></i>').join('') || '<i></i>';
    return '<button class="dayrow'+(isToday(d)?' is-today':'')+'" data-goto="'+dkey(d)+'"><span class="nm">'+cap(DN[d.getDay()]).slice(0,3)+'<small>'+d.getDate()+' '+MN[d.getMonth()].slice(0,3)+'</small></span><span class="segs">'+segs+'</span><span class="ct">'+s.done+'/'+s.total+'</span></button>'; }).join('');
  let streak = 0;
  for (let i = 0; i < 120; i++){ const s = dayStats(addDays(new Date(), -i)); if (!s.total) continue; if (s.done/s.total >= .8) streak++; else if (i === 0) continue; else break; }
  return '<header class="page-h st"><h1>Tu semana</h1><p>Del '+ws.getDate()+' de '+MN[ws.getMonth()]+' al '+we.getDate()+' de '+MN[we.getMonth()]+'</p></header>'+
    '<div class="stats st">'+
      '<div class="stat t-gym"><b>'+(tot?Math.round(done/tot*100):0)+'%</b><span>de lo planeado, hecho</span></div>'+
      '<div class="stat t-despertar"><b>'+streak+'</b><span>'+(streak===1?'día':'días')+' de racha</span></div>'+
      '<div class="stat t-clase"><b>'+fmtDur(focus)+'</b><span>de enfoque</span></div>'+
      '<div class="stat t-leer"><b>'+gym+'</b><span>'+(gym===1?'entrenamiento':'entrenamientos')+'</span></div></div>'+
    '<div class="days-list glass st">'+rows+'</div>'+
    '<p class="muted st" style="font-size:14px;margin:14px 4px 0">Un día suma a tu racha cuando haces al menos el 80% de lo que planeaste.</p>';
}
function viewTu(){
  const on = S.remindOn && notif.perm === 'granted';
  const avisos = NATIVE

function startOnboarding(redo){

  }

}
function obItem(k){ if (!ob.items[k]){ const c = CATALOG.find(x => x.k === k); ob.items[k] = {start:c.start, end:c.end, days:c.days.slice(), title: k==='otro' ? '' : LABEL[k], subjects:'', vary:false, times:{}}; } return ob.items[k]; }
function syncOb(){
  document.querySelectorAll('#ob [data-ob]').forEach(i => { ob[i.dataset.ob] = i.value; });
  document.querySelectorAll('#ob [data-obi]').forEach(i => { const [k,f] = i.dataset.obi.split('.'); obItem(k)[f] = i.value; });

function overlapFor(k){
  const me = ob.items[k]; if (!me) return '';

  for (const o of ob.picks){ if (o === k) continue; const it = ob.items[o]; if (!it || ob.picks.indexOf(o) > ob.picks.indexOf(k)) continue;
    for (const d of me.days){ if (!it.days.includes(d)) continue;
      const [s1,e1] = span(slot(me,d)), [s2,e2] = span(slot(it,d));

  return '';
}

  const acts = [mk('despertar','Despertar', ob.wake, fromMin(toMin(ob.wake)+30), ALL.slice(), 0)];
  for (const k of ob.picks){ const it = obItem(k); if (!it.days.length) continue;
    const a = mk(k, k==='otro' ? (it.title.trim() || 'Otra cosa') : (findOld(k)?.title || LABEL[k]), it.start, it.end, it.days.slice().sort(), 10);
    a.vary = !!it.vary; if (a.vary) a.times = JSON.parse(JSON.stringify(it.times||{}));
    normalizeTimes(a); acts.push(a);
    if (k === 'clase' && it.subjects.trim())
      for (const name of it.subjects.split(',').map(x => x.trim()).filter(Boolean)) if (!S.classes.some(c => c.name.toLowerCase() === name.toLowerCase())) S.classes.push({id:uid(), name, room:'', who:''});
  }
  acts.push(mk('dormir','Dormir', ob.sleep, ob.wake, ALL.slice(), 30));
  const cl = acts.find(a => a.type === 'clase'); if (cl && !cl.pref && S.classes[0]) cl.pref = {classId: S.classes[0].id};
  S.name = ob.name.trim(); S.wake = ob.wake; S.sleep = ob.sleep; S.activities = acts; S.onboarded = true;
  if (!keep) S.log = {};
  save(); ob = null; $('#ob').hidden = true; view = 'hoy'; sel = dayOnly(new Date()); animNext = true; render(); window.scrollTo(0,0);
  buzz('MEDIUM'); toast('Tu semana está lista');
  if (S.remindOn) scheduleAll();
}

/* ---------- logros: mensaje motivador al completar una actividad ---------- */
const CHEER = {
  start: ['Arrancaste. Lo más difícil ya pasó.', 'Primer paso hecho. Así se construye un buen día.', 'Buen comienzo. Uno a la vez.', 'Ya estás en movimiento. No pares ahora.', 'Empezar es ganar la mitad.'],
  mid:   ['Vas a mitad de camino. Mantén el ritmo.', 'Cada bloque cuenta. Sigue así.', 'Vas mejor de lo que crees.', 'La constancia le gana al talento. Sigue.', 'Hoy estás cumpliendo lo que te prometiste.'],
  high:  ['Ya casi. Termina fuerte.', 'Te falta poco para cerrar el día.', 'Este es el tramo que separa a los que cumplen.', 'Un empujón más y lo tienes.', 'Lo estás logrando. No aflojes ahora.'],
  full:  ['Esto es disciplina de verdad.', 'Cumpliste todo lo que planeaste. Así se hace.', '100%. Mañana, a repetirlo.', 'Día redondo. Tu yo del futuro te lo agradece.', 'Todo hecho. Descansa, te lo ganaste.']
};
const CHEER_TITLE = { start:'¡Buen arranque!', mid:'¡Vas muy bien!', high:'¡Ya casi!', full:'¡Día completo!' };
function cheerFor(pct){
  const tier = pct >= 100 ? 'full' : pct >= 70 ? 'high' : pct >= 35 ? 'mid' : 'start';
  S.cheerIdx ??= {}; const i = (S.cheerIdx[tier] = ((S.cheerIdx[tier] ?? -1) + 1) % CHEER[tier].length);
  let msg = CHEER[tier][i]; if (S.name && Math.random() < .5) msg = msg.replace(/\.$/, ', '+S.name+'.');
  return {tier, title: CHEER_TITLE[tier], msg};
}
let cheerT;
function celebrate(d, prevPct){
  const st = dayStats(d), pct = st.total ? Math.round(st.done/st.total*100) : 0;
  if (S.cheerOff){ toast(pct >= 100 ? 'Día completo' : 'Hecha · '+st.done+' de '+st.total); return; }
  const c = cheerFor(pct), when = isToday(d) ? 'de tu día' : 'del '+DN[d.getDay()];
  // notificación del celular (app de Android)
  if (LN && notif.perm === 'granted'){
    const n = {id: 80000 + Math.floor(Math.random()*9000), channelId:'rumbo', title: (pct >= 100 ? '100% '+when+' 🏆' : 'Llevas '+pct+'% '+when+' 🔥'), body: c.msg, schedule:{at:new Date(Date.now()+600)}};
    Promise.resolve(LN.createChannel({id:'rumbo', name:'Recordatorios', description:'Avisos de tus actividades', importance:5, visibility:1, vibration:true})).catch(()=>{})
      .then(() => LN.schedule({notifications:[n]})).catch(()=>{});
  }
  save();
  // tarjeta dentro de la app
  const C = 2*Math.PI*44, el = $('#cheer');
  el.innerHTML = '<div class="cheer-card'+(c.tier==='full'?' full':'')+'"><div class="cring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>'+
    '<circle class="v" cx="50" cy="50" r="44" fill="none" stroke="url(#cg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-prevPct/100))+'"/>'+
    '<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB36B"/><stop offset="1" stop-color="#FF4D2E"/></linearGradient></defs></svg><b data-pct>'+prevPct+'%</b></div>'+
    '<div class="ctext"><span class="ct">'+c.title+'</span><p>'+esc(c.msg)+'</p><small>'+st.done+' de '+st.total+' actividades '+when+'</small></div></div>';
  el.hidden = false; requestAnimationFrame(() => { el.classList.add('show');
    setTimeout(() => { const v = el.querySelector('.v'); if (v) v.style.strokeDashoffset = C*(1-pct/100);
      const b = el.querySelector('[data-pct]'), t0 = performance.now();
      const step = t => { const k = Math.min(1,(t-t0)/900), e = 1-Math.pow(1-k,3); if (b) b.textContent = Math.round(prevPct + (pct-prevPct)*e)+'%'; if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step); }, 120); });
  if (pct >= 100) buzz('HEAVY');
  clearTimeout(cheerT); cheerT = setTimeout(hideCheer, pct >= 100 ? 4200 : 3200);
}
function hideCheer(){ const el = $('#cheer'); el.classList.remove('show'); setTimeout(() => { if (!el.classList.contains('show')) el.hidden = true; }, 300); }

/* ---------- enfoque ---------- */
let focus = null, focusLen = 25;
function tick(){
  if (!focus) return;
  const left = Math.max(0, focus.end - Date.now()), m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
  const txt = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  document.querySelectorAll('[data-clock]').forEach(el => { if (sheet && sheet.id === focus.id) el.textContent = txt; });
  if (left <= 0){
    const e = entry(new Date(focus.date+'T12:00'), focus.id); e.focus = (e.focus||0) + focus.mins; save();
    toast('Enfoque completo: +'+focus.mins+' min'); buzz('HEAVY');
    focus = null; sheet ? renderSheet() : render();
  }
}
setInterval(tick, 1000);
setInterval(() => { if (view === 'hoy' && !sheet && !ob && isToday(sel)) render(); }, 60000);

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- eventos ---------- */
function syncDraft(){
  if (!sheet || !sheet.draft) return;
  document.querySelectorAll('#sheet [data-draft]').forEach(i => sheet.draft[i.dataset.draft] = i.value);
  document.querySelectorAll('#sheet [data-rdraft]').forEach(i => sheet.draft[i.dataset.rdraft] = i.value);
  document.querySelectorAll('#sheet [data-cdraft]').forEach(i => sheet.draft[i.dataset.cdraft] = i.value);
}
function linkRoutine(a, id){ const e = entry(sel,a.id); e.routineId = id; e.ex = {}; a.pref = {...(a.pref||{}), routineId:id}; }
/* objeto con days/vary/times según prefijo ('dr' o 'obi.<k>') */
const holder = p => p === 'dr' ? sheet.draft : obItem(p.split('.')[1]);
function rerender(p){ if (p === 'dr' || p === 'once') renderSheet(); else { const y = $('#ob').scrollTop; renderOb(); $('#ob').scrollTop = y; } }
function syncAny(p){ if (p === 'dr' || p === 'once') syncDraft(); else syncOb(); }

document.addEventListener('click', ev => {
  if (ev.target.id === 'scrim'){ closeSheet(); return; }
  if (ev.target.closest('#cheer')){ hideCheer(); return; }
  const b = ev.target.closest('button, [data-open]'); if (!b) return;
  const D = b.dataset;

  // selector de horario
  if (D.ts){ const ctx = D.ts, p = ctx.split('.')[0]; syncAny(p === 'obi' ? 'ob' : p);
    if (p === 'ob'){ ob[ctx.split('.')[1]] = D.v; } else { const o = tgt(ctx), dur = durMin(o); o.start = D.v; o.end = fromMin(toMin(D.v) + dur); }
    buzz(); rerender(p === 'ob' || p === 'obi' ? 'ob' : p); return; }
  if (D.td){ const ctx = D.td, p = ctx.split('.')[0]; syncAny(p === 'obi' ? 'ob' : p); const o = tgt(ctx); o.end = fromMin(toMin(o.start) + (+D.v)); buzz(); rerender(p === 'obi' ? 'ob' : p); return; }
  if (D.preset){ const p = D.preset; syncAny(p === 'dr' ? 'dr' : 'ob'); const o = holder(p); o.days = PRESETS[+D.i][1].slice(); if (o.vary) fillTimes(o); buzz(); rerender(p === 'dr' ? 'dr' : 'ob'); return; }
  if (D.dday){ const p = D.dday; syncAny(p === 'dr' ? 'dr' : 'ob'); const o = holder(p), d = +D.d, i = o.days.indexOf(d); i >= 0 ? o.days.splice(i,1) : o.days.push(d); if (o.vary) fillTimes(o); buzz(); rerender(p === 'dr' ? 'dr' : 'ob'); return; }
  if (D.vary){ const p = D.vary; syncAny(p === 'dr' ? 'dr' : 'ob'); const o = holder(p); o.vary = D.v === '1'; if (o.vary) fillTimes(o); rerender(p === 'dr' ? 'dr' : 'ob'); return; }
  if (D.eday){ const p = D.eday; syncAny(p === 'dr' ? 'dr' : 'ob'); if (p === 'dr') sheet.eday = +D.d; else ob.eday = +D.d; rerender(p === 'dr' ? 'dr' : 'ob'); return; }
  if (D.copyall){ const p = D.copyall; syncAny(p === 'dr' ? 'dr' : 'ob'); const o = holder(p), src = o.times[D.d]; for (const d of o.days) o.times[d] = {...src}; o.start = src.start; o.end = src.end; o.vary = false; toast('Mismo horario para todos los días'); rerender(p === 'dr' ? 'dr' : 'ob'); return; }

  // bienvenida
  if ('obNext' in D){ syncOb();
    if (ob.step === 1 && !ob.name.trim()){ toast('Escribe tu nombre'); return; }
    if (ob.step >= 4){ const it = obItem(ob.picks[ob.step-4]); if (!it.days.length){ toast('Elige al menos un día'); return; } }
    ob.step++; ob.eday = null; renderOb(); $('#ob').scrollTop = 0; return; }
  if ('obBack' in D){ syncOb(); ob.step--; ob.eday = null; renderOb(); $('#ob').scrollTop = 0; return; }
  if ('obCancel' in D){ ob = null; $('#ob').hidden = true; render(); return; }
  if (D.pick){ syncOb(); const i = ob.picks.indexOf(D.pick); i >= 0 ? ob.picks.splice(i,1) : ob.picks.push(D.pick); buzz(); renderOb(); return; }
  if ('obFinish' in D){ syncOb(); const it = obItem(ob.picks[ob.step-4]); if (!it.days.length){ toast('Elige al menos un día'); return; } finishOnboarding(); return; }
  if ('redo' in D){ startOnboarding(true); return; }

  if (D.view){ view = D.view; animNext = true; render(); window.scrollTo(0,0); return; }
  if (D.day){ sel = new Date(D.day+'T00:00'); animNext = true; render(); return; }
  if (D.goto){ sel = new Date(D.goto+'T00:00'); view = 'hoy'; animNext = true; render(); window.scrollTo(0,0); return; }
  if (D.done){ ev.stopPropagation(); const s0 = dayStats(sel), prev = s0.total ? Math.round(s0.done/s0.total*100) : 0;
    const e = entry(sel, D.done); e.done = !e.done; save(); buzz(e.done ? 'MEDIUM' : 'LIGHT');
    if (e.done) celebrate(sel, prev);
    sheet ? closeSheet() : render(); return; }
  if (D.open){ openSheet({kind:'act', id:D.open}); return; }
  if ('close' in D){ if (sheet && sheet.back){ sheet = {kind:'act', id:sheet.back}; renderSheet(); } else closeSheet(); return; }
  if (D.pickRoutine){ linkRoutine(actById(sheet.id), D.pickRoutine); save(); renderSheet(); return; }
  if (D.template){ const t = TEMPLATES.find(x => x.name === D.template); const r = {id:uid(), name:t.name, ex:t.ex.slice()}; S.routines.push(r);
    if (sheet && sheet.kind === 'act') linkRoutine(actById(sheet.id), r.id); save(); renderSheet(); toast('Rutina '+t.name+' agregada'); return; }
  if (D.pickClass){ const a = actById(sheet.id); entry(sel,a.id).classId = D.pickClass; a.pref = {...(a.pref||{}), classId:D.pickClass}; save(); renderSheet(); return; }
  if (D.focusLen){ focusLen = +D.focusLen; renderSheet(); return; }
  if ('focusStart' in D){ focus = {id:sheet.id, date:dkey(sel), mins:focusLen, end:Date.now()+focusLen*60000}; renderSheet(); toast('Enfoque de '+focusLen+' min. Guarda el celular.'); return; }
  if ('focusStop' in D){ focus = null; renderSheet(); return; }
  if ('remindOn' in D){ enableReminders(); return; }
  if ('remindTest' in D){ testReminder(); return; }
  if ('ics' in D){ exportICS(); return; }
  if ('exact' in D){ LN && LN.changeExactNotificationSetting().then(refreshNotifState).catch(()=>{}); return; }

  // cambiar solo un día
  if ('onceOpen' in D){ const a = inst(actById(sheet.id), sel); sheet.once = {start:a.start, end:a.end}; renderSheet(); return; }
  if ('onceCancel' in D){ delete sheet.once; renderSheet(); return; }
  if ('onceSave' in D){ const base = actById(sheet.id), e = entry(sel, base.id), def = slot(base, sel.getDay()), o = sheet.once;
    if (o.start === def.start && o.end === def.end) delete e.time; else e.time = {start:o.start, end:o.end};
    delete sheet.once; save(); renderSheet(); toast('Hora cambiada solo para '+(isToday(sel)?'hoy':'ese día')); return; }
  if ('onceReset' in D){ delete entry(sel, sheet.id).time; save(); renderSheet(); toast('Volvió a su hora normal'); return; }
  if ('skip' in D){ const t = actById(sheet.id).title; entry(sel, sheet.id).skip = true; save(); closeSheet(); toast(t+' quitado de '+(isToday(sel)?'hoy':'ese día')); return; }
  if (D.unskip){ delete entry(sel, D.unskip).skip; save(); render(); return; }

  // actividades
  if ('new' in D){ openSheet({kind:'edit', id:null, draft:{title:'', type:'otro', start:'09:00', end:'10:00', days:[sel.getDay()], remind:10, vary:false, times:{}}}); return; }
  if (D.editAct){ const a = actById(D.editAct); openSheet({kind:'edit', id:a.id, back: sheet && sheet.kind === 'act' ? a.id : null, draft:{...a, days:a.days.slice(), times: JSON.parse(JSON.stringify(a.times||{}))}}); return; }
  if (D.draftType){ syncDraft(); const dr = sheet.draft; if (!dr.title.trim() || Object.values(LABEL).includes(dr.title)) dr.title = LABEL[D.draftType]; dr.type = D.draftType; renderSheet(); return; }
  if (D.draftRemind){ syncDraft(); sheet.draft.remind = D.draftRemind === 'off' ? null : +D.draftRemind; renderSheet(); return; }
  if ('saveAct' in D){ syncDraft(); const dr = sheet.draft;
    if (!dr.title.trim()) dr.title = LABEL[dr.type];
    if (!dr.days.length){ toast('Elige al menos un día'); return; }
    normalizeTimes(dr);
    if (sheet.id){ const a = actById(sheet.id); Object.assign(a, dr); if (!dr.vary) delete a.times; } else S.activities.push({...dr, id:uid()});
    save(); buzz('MEDIUM'); toast('Guardado'); const back = sheet.back;
    if (back){ sheet = {kind:'act', id:back}; renderSheet(); } else closeSheet(); return; }
  if ('delAct' in D){ if (!sheet.confirm){ syncDraft(); sheet.confirm = true; renderSheet(); return; }
    S.activities = S.activities.filter(a => a.id !== sheet.id); save(); toast('Actividad borrada'); closeSheet(); return; }

  // rutinas
  if ('editRoutine' in D){ const r = D.editRoutine ? routine(D.editRoutine) : null;
    openSheet({kind:'routine', id:r?r.id:null, back: sheet && sheet.kind === 'act' ? sheet.id : null, draft:{name:r?r.name:'', ex:r?r.ex.join('\n'):''}}); return; }
  if ('saveRoutine' in D){ syncDraft(); const dr = sheet.draft, ex = dr.ex.split('\n').map(s => s.trim()).filter(Boolean);
    if (!dr.name.trim()){ toast('Ponle un nombre a la rutina'); return; }
    let id = sheet.id; if (id) Object.assign(routine(id), {name:dr.name.trim(), ex}); else { id = uid(); S.routines.push({id, name:dr.name.trim(), ex}); }
    if (sheet.back){ const a = actById(sheet.back); if (!sheet.id) linkRoutine(a, id); save(); sheet = {kind:'act', id:a.id}; renderSheet(); } else { save(); closeSheet(); }
    toast('Rutina guardada'); return; }
  if ('delRoutine' in D){ if (!sheet.confirm){ syncDraft(); sheet.confirm = true; renderSheet(); return; }
    S.routines = S.routines.filter(r => r.id !== sheet.id); save(); toast('Rutina borrada'); closeSheet(); return; }

  // clases
  if ('editClass' in D){ const c = D.editClass ? klass(D.editClass) : null;
    openSheet({kind:'class', id:c?c.id:null, back: sheet && sheet.kind === 'act' ? sheet.id : null, draft:{name:c?c.name:'', room:c?c.room:'', who:c?c.who:''}}); return; }
  if ('saveClass' in D){ syncDraft(); const dr = sheet.draft;
    if (!dr.name.trim()){ toast('Ponle nombre a la materia'); return; }
    let id = sheet.id; const v = {name:dr.name.trim(), room:dr.room.trim(), who:dr.who.trim()};
    if (id) Object.assign(klass(id), v); else { id = uid(); S.classes.push({id, ...v}); }
    if (sheet.back){ const a = actById(sheet.back); if (!sheet.id){ entry(sel,a.id).classId = id; a.pref = {...(a.pref||{}), classId:id}; } save(); sheet = {kind:'act', id:a.id}; renderSheet(); } else { save(); closeSheet(); }
    toast('Materia guardada'); return; }
  if ('delClass' in D){ if (!sheet.confirm){ syncDraft(); sheet.confirm = true; renderSheet(); return; }
    S.classes = S.classes.filter(c => c.id !== sheet.id); save(); toast('Materia borrada'); closeSheet(); return; }
});

document.addEventListener('change', ev => {
  const t = ev.target, D = t.dataset;
  if ('cheerToggle' in D){ S.cheerOff = !t.checked; save(); toast(t.checked ? 'Mensajes de logro activados' : 'Mensajes de logro apagados'); return; }
  if ('remindToggle' in D){ if (t.checked) enableReminders(); else { S.remindOn = false; save(); scheduleAll(); render(); toast('Recordatorios apagados'); } return; }
  if (!sheet || sheet.kind !== 'act') return;
  const a = actById(sheet.id), e = entry(sel, a.id);
  if (D.ex !== undefined){ e.ex ??= {}; e.ex[D.ex] = t.checked; buzz(); const r = routineOf(sel,a);
    if (r && r.ex.length && r.ex.every((_,i) => e.ex[i]) && !e.done){ const s0 = dayStats(sel), prev = s0.total ? Math.round(s0.done/s0.total*100) : 0; e.done = true; buzz('MEDIUM'); celebrate(sel, prev); }
    save(); renderSheet(); return; }
  if (D.chk){ e[D.chk] ??= {}; e[D.chk][D.i] = t.checked; buzz(); save(); renderSheet(); return; }
  if (D.prioOk !== undefined){ e.prio ??= []; e.prio[D.prioOk] = {...(e.prio[D.prioOk]||{t:''}), ok:t.checked}; buzz(); save(); renderSheet(); return; }
  if (D.flag){ e[D.flag] = t.checked; save(); renderSheet(); return; }
});
document.addEventListener('input', ev => {
  const t = ev.target, D = t.dataset; if (!sheet || sheet.kind !== 'act') return;
  const e = entry(sel, sheet.id);
  if (D.field){ e[D.field] = t.value; save(); }
  if (D.prio !== undefined){ e.prio ??= []; e.prio[D.prio] = {...(e.prio[D.prio]||{}), t:t.value}; save(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheet) closeSheet();
  if (ev.key === 'Enter' && ob && ev.target.id === 'ob-name'){ ev.preventDefault(); $('#ob [data-ob-next]')?.click(); }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.now[data-open]')){ ev.preventDefault(); ev.target.click(); }
});

/* ---------- app nativa ---------- */
if (SB){ try { SB.setStyle({style:'DARK'}); SB.setBackgroundColor && SB.setBackgroundColor({color:'#09090B'}); } catch(e){} }
if (AppP){
  AppP.addListener('backButton', () => {
    if (sheet) closeSheet();
    else if (ob && ob.step > 0 && !(ob.redo && ob.step === 1)){ syncOb(); ob.step--; renderOb(); }
    else if (ob && ob.redo){ ob = null; $('#ob').hidden = true; render(); }
    else if (!ob && view !== 'hoy'){ view = 'hoy'; render(); }
    else AppP.minimizeApp();
  });
  AppP.addListener('resume', () => { if (!sheet && !ob) render(); refreshNotifState().then(() => { if (S.remindOn && notif.perm === 'granted') scheduleAll(); }); });
}
if (LN){
  LN.addListener('localNotificationActionPerformed', ev => {
    const id = ev.notification?.extra?.actId; if (!id || !actById(id)) return;
    sel = dayOnly(new Date()); view = 'hoy'; render(); openSheet({kind:'act', id});
  });
}
if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
if (!S.onboarded) startOnboarding(false);
refreshNotifState().then(() => { if (S.remindOn && notif.perm === 'granted') scheduleAll(); });
</script>
