<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rumbo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C6B56">
<meta name="description" content="Organiza tu día por bloques: gym, clases, trabajo y descanso. Con recordatorios.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una columna tipo app de celular; cabecera con progreso del día, línea de tiempo vertical, hoja inferior para el detalle de cada bloque, barra de navegación fija abajo. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#141A1E; --muted:#5F6B72; --line:#DCE2E0;
  --accent:#1C6B56; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6; --danger:#B3402C;
  --c-gym:#D9533A; --c-clase:#6A57D0; --c-trabajo:#C2810C; --c-estudio:#1B7FA0; --c-dormir:#3D4B8E; --c-otro:#4F7A5E;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1214; --surface:#161C1F; --surface-2:#1C2327; --ink:#E7EDEB; --muted:#8E9A9F; --line:#273035;
  --accent:#4CC09D; --accent-ink:#08201A; --accent-soft:#183A31; --danger:#F08A73;
  --c-gym:#F07D63; --c-clase:#A094F2; --c-trabajo:#E6B04A; --c-estudio:#5BC0E0; --c-dormir:#8A98E0; --c-otro:#8DBF9C;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1214; --surface:#161C1F; --surface-2:#1C2327; --ink:#E7EDEB; --muted:#8E9A9F; --line:#273035;
  --accent:#4CC09D; --accent-ink:#08201A; --accent-soft:#183A31; --danger:#F08A73;
  --c-gym:#F07D63; --c-clase:#A094F2; --c-trabajo:#E6B04A; --c-estudio:#5BC0E0; --c-dormir:#8A98E0; --c-otro:#8DBF9C;
  color-scheme:dark }
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top, 0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.remind-card{display:flex;flex-direction:column;gap:10px;background:var(--accent-soft);border-radius:var(--r);padding:14px;margin-top:12px}
.remind-card p{margin:0;font-size:14px}
.remind-card .actions{flex-wrap:wrap}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 120px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Cabecera */
.top{display:flex;align-items:center;gap:14px;padding-block:6px 14px}
.top .date{flex:1;min-width:0}
.top h1{font-size:30px;line-height:1.05;margin-top:2px}
.top h1 span{color:var(--muted);font-weight:600}
.ring{width:62px;height:62px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px}
.next{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
.next .lbl{color:var(--muted)}
.next strong{font-weight:600}
.pill{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.sync{font-size:12px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--accent)}

/* Tira de la semana */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-block:14px 6px}
.strip button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:12px;color:var(--muted)}
.strip button .n{font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.strip button .d{font-size:11px;font-weight:600;letter-spacing:.05em}
.strip button .bar{width:18px;height:3px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.strip button .bar u{display:block;height:100%;background:var(--accent)}
.strip button.today .d{color:var(--accent)}
.strip button[aria-current="date"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}

/* Línea de tiempo */
.timeline{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:54px 1fr 44px;gap:10px;align-items:stretch;position:relative;padding-bottom:10px}
.item::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:1px;background:var(--line)}
.when{text-align:right;padding-top:12px;line-height:1.1}
.when .t{font-family:var(--f-mono);font-size:14px;display:block}
.when .p{font-size:11px;color:var(--muted)}
.card{position:relative;text-align:left;display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 11px 12px;min-width:0;margin-left:10px;transition:transform .12s ease}
.card:active{transform:scale(.985)}
.card::before{content:"";position:absolute;left:-14px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--cat)}
.ico{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb, var(--cat) 14%, transparent);color:var(--cat)}
.ico svg{width:19px;height:19px}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted)}
.chip{align-self:flex-start;margin-top:5px;font-size:12px;font-weight:600;color:var(--cat);background:color-mix(in srgb, var(--cat) 11%, transparent);padding:3px 8px;border-radius:7px;overflow-wrap:anywhere}
.chip.empty{color:var(--muted);background:var(--surface-2);font-weight:500}
.check{align-self:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--surface)}
.check svg{width:18px;height:18px}
.item.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.done .title{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.item.done .card{background:var(--surface-2)}
.item.now .card{border-color:var(--cat);box-shadow:0 0 0 1px var(--cat)}
.item.now .card::before{background:var(--cat)}
.tag-now{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--cat);margin-left:6px}
.nowline{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;margin:-4px 0 6px}
.nowline span{font-family:var(--f-mono);font-size:11px;color:var(--danger);text-align:right}
.nowline i{height:1.5px;background:var(--danger);position:relative;margin-left:4px}
.nowline i::before{content:"";position:absolute;left:-4px;top:-3.5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.empty-day{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);margin-top:14px}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb, var(--surface) 92%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px, calc(50vw - 242px));bottom:calc(76px + env(safe-area-inset-bottom, 0px));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 22px -8px color-mix(in srgb, var(--accent) 70%, transparent)}
.fab svg{width:24px;height:24px}

/* Hoja inferior */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,12,14,.42);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet.open{transform:none}
.sheet .in{max-width:520px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:10px 22px;display:flex;flex-direction:column;gap:18px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .ico{width:44px;height:44px;border-radius:13px}
.sh-head .ico svg{width:23px;height:23px}
.sh-head h2{font-size:22px}
.sh-head .meta{font-size:13px}
.sh-head .grow{flex:1;min-width:0}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 2px}
.sec{display:flex;flex-direction:column;gap:9px}
.sec h3{font-size:16px}
.sec .hint{font-size:13px;color:var(--muted);margin-top:-5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 13px;border-radius:11px;border:1px solid var(--line);font-size:14px;font-weight:500;background:var(--surface)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips button.add{border-style:dashed;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);min-height:48px}
.row+.row{border-top:1px solid var(--line)}
.row input[type="checkbox"]{appearance:none;width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;margin:0;background:var(--surface)}
.row input[type="checkbox"]:checked{background:var(--accent);border-color:var(--accent)}
.row input[type="checkbox"]:checked::after{content:"";width:10px;height:6px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.row label{flex:1;min-width:0;overflow-wrap:anywhere}
.row.ok label{color:var(--muted);text-decoration:line-through}
.row input[type="text"]{flex:1;min-width:0;border:0;background:transparent;padding:4px 0;outline:none}
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:11px 12px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:9px 0;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.info{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.info b{color:var(--ink);font-weight:600}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress u{display:block;height:100%;background:var(--cat, var(--accent));transition:width .25s}
.focus{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:var(--r);padding:14px}
.focus .clock{font-family:var(--f-mono);font-size:30px;letter-spacing:-.02em;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.btn.sm{padding:9px 13px;font-size:14px}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}

/* Semana y biblioteca */
.page-h{padding-block:8px 16px}
.page-h h1{font-size:28px;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.days-list{margin-top:18px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dayrow{display:grid;grid-template-columns:76px 1fr 40px;gap:10px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.dayrow+.dayrow{border-top:1px solid var(--line)}
.dayrow .nm{font-weight:600;font-size:14px}
.dayrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.segs{display:flex;gap:3px;min-width:0}
.segs i{flex:1;height:10px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.segs i.on{background:var(--cat);border-color:var(--cat)}
.dayrow .ct{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right}
.dayrow.is-today .nm{color:var(--accent)}
.lib-sec{margin-bottom:24px;display:flex;flex-direction:column;gap:10px}
.lib-sec .hd{display:flex;align-items:baseline;justify-content:space-between}
.lib-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px}
.lib-item .grow{flex:1;min-width:0}
.lib-item .grow b{display:block;font-weight:600}
.lib-item .grow span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.lib-item svg{width:16px;height:16px;color:var(--muted);flex:none}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:.22s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="nav" aria-label="Secciones">
  <div class="in">
    <button data-view="hoy" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Hoy</button>
    <button data-view="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>Semana</button>
    <button data-view="biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>Rutinas y clases</button>
  </div>
</nav>
<button class="fab" id="fab" data-new aria-label="Agregar actividad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle" hidden><div class="in" id="sheetIn"></div></section>
<div class="toast" id="toast" role="status"></div>

<script>
const TYPES = {
  gym:     {label:'Gym',      ico:'<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>'},
  clase:   {label:'Clase',    ico:'<path d="M3 8.5 12 4l9 4.5-9 4.5z"/><path d="M7 10.5V15c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5M21 8.5v5"/>'},
  trabajo: {label:'Trabajo',  ico:'<rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V5.5h6v2M3.5 12.5h17"/>'},
  estudio: {label:'Estudio',  ico:'<path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h11M9 8.5h6"/>'},
  dormir:  {label:'Dormir',   ico:'<path d="M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z"/>'},
  otro:    {label:'Otro',     ico:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'}
};
const ORDER = [1,2,3,4,5,6,0];
const DL = ['D','L','M','X','J','V','S'];
const DN = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MN = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const SLEEP_CHECKS = ['Sin pantallas 30 min antes','Ropa y mochila listas para mañana','Revisé la agenda de mañana','Alarma puesta'];
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
const ALL = [0,1,2,3,4,5,6];

function defaults(){
  return { v:1,
    activities:[
      {id:'a1',type:'otro',title:'Despertar y planear el día',start:'06:30',end:'07:00',days:ALL.slice()},
      {id:'a2',type:'gym',title:'Entrenar',start:'07:00',end:'08:30',days:[1,2,3,4,5,6],pref:{routineId:'r1'}},
      {id:'a3',type:'clase',title:'Clases',start:'13:00',end:'16:00',days:[1,2,3,4,5],pref:{classId:'k1'}},
      {id:'a4',type:'trabajo',title:'Trabajo',start:'17:00',end:'22:00',days:[1,2,3,4,5,6]},
      {id:'a5',type:'dormir',title:'Dormir',start:'23:00',end:'06:30',days:ALL.slice()}
    ],
    routines:[
      {id:'r1',name:'Empuje',ex:['Press de banca 4×8','Press militar 3×10','Fondos 3×12','Extensión de tríceps 3×12']},
      {id:'r2',name:'Jalón',ex:['Dominadas 4×6','Remo con barra 4×8','Face pull 3×15','Curl de bíceps 3×12']},
      {id:'r3',name:'Pierna',ex:['Sentadilla 4×6','Peso muerto rumano 3×10','Zancadas 3×12','Pantorrilla 4×15']},
      {id:'r4',name:'Cardio',ex:['Calentamiento 5 min','Intervalos 20 min','Estiramiento 10 min']}
    ],
    classes:[
      {id:'k1',name:'Cálculo',room:'Aula 204',who:''},
      {id:'k2',name:'Programación',room:'Laboratorio 3',who:''},
      {id:'k3',name:'Inglés',room:'Aula 110',who:''}
    ],
    log:{}
  };
}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const toMin = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return h*60 + (m||0); };
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dayOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const weekStart = d => addDays(dayOnly(d), -((d.getDay()+6)%7));
const nowMin = () => { const n = new Date(); return n.getHours()*60 + n.getMinutes(); };
const isToday = d => dkey(d) === dkey(new Date());
function fmtT(t){ const m = toMin(t); let h = Math.floor(m/60), mm = m%60; const p = h < 12 ? 'a. m.' : 'p. m.'; h = h%12 || 12; return {t: h+':'+String(mm).padStart(2,'0'), p}; }
const fmtFull = t => { const f = fmtT(t); return f.t+' '+f.p; };
function durMin(a){ let s = toMin(a.start), e = toMin(a.end); if (e <= s) e += 1440; return e - s; }
function fmtDur(m){ const h = Math.floor(m/60), r = m%60; return (h ? h+' h' : '') + (h && r ? ' ' : '') + (r ? r+' min' : (h ? '' : '0 min')); }
const ico = type => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+TYPES[type].ico+'</svg>';
const cat = type => 'var(--c-'+type+')';

/* ---------- recordatorios (notificaciones locales del celular) ---------- */
const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const LN = NATIVE ? CAP.Plugins.LocalNotifications : null;
const AppP = NATIVE ? CAP.Plugins.App : null;
const REMIND_OPTS = [[null,'Sin aviso'],[0,'A la hora'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[30,'30 min antes']];
let notif = {perm: NATIVE ? 'prompt' : 'web', exact: 'granted'};

async function refreshNotifState(){
  if (!LN) return;
  try { notif.perm = (await LN.checkPermissions()).display; } catch(e){}
  try { notif.exact = (await LN.checkExactNotificationSetting()).exact_alarm; } catch(e){ notif.exact = 'granted'; }
  if (view === 'hoy' || view === 'biblioteca') { if (!sheet) render(); }
}
async function enableReminders(){
  if (!LN){ toast('Los recordatorios funcionan en la app del celular'); return; }
  let p = notif.perm;
  try { if (p !== 'granted') p = (await LN.requestPermissions()).display; } catch(e){}
  notif.perm = p;
  if (p !== 'granted'){ toast('Permite las notificaciones de Rumbo en los ajustes del celular'); render(); return; }
  S.remindOn = true; save(); await scheduleAll(); await refreshNotifState(); render();
  toast('Recordatorios activados');
}
function reminderText(a){
  if (a.type === 'gym'){ const r = routine(a.pref?.routineId); return r ? 'Hoy toca '+r.name+'. Prepara tu ropa y agua.' : 'Elige tu rutina y a darle.'; }
  if (a.type === 'clase'){ const c = klass(a.pref?.classId); return c ? c.name + (c.room ? ' · '+c.room : '') : 'Abre Rumbo y marca en qué clase estás.'; }
  if (a.type === 'trabajo') return 'Antes de empezar, define tus 3 prioridades.';
  if (a.type === 'dormir') return 'Deja el celular, prepara lo de mañana y descansa.';
  return 'Es hora de: ' + a.title;
}
let scheduling = Promise.resolve();
function scheduleAll(){ scheduling = scheduling.then(doSchedule, doSchedule); return scheduling; }
async function doSchedule(){
  if (!LN) return;
  try {
    const pend = await LN.getPending();
    if (pend.notifications.length) await LN.cancel({notifications: pend.notifications.map(n => ({id: n.id}))});
    if (!S.remindOn || notif.perm !== 'granted') return;
    try { await LN.createChannel({id:'rumbo', name:'Recordatorios', description:'Avisos de tus actividades', importance:5, visibility:1, vibration:true}); } catch(e){}
    const list = []; let nid = 1;
    for (const a of S.activities){
      if (a.remind === null || a.remind === undefined) continue;
      let t = toMin(a.start) - a.remind, shift = 0;
      if (t < 0){ t += 1440; shift = -1; }
      for (const d of a.days){
        const wd = ((d + shift + 7) % 7) + 1; // Capacitor: 1 = domingo
        const f = fmtFull(a.start);
        list.push({ id: nid++, channelId:'rumbo',
          title: a.remind ? 'En '+a.remind+' min: '+a.title : a.title+' · '+f,
          body: reminderText(a),
          schedule: { on: { weekday: wd, hour: Math.floor(t/60), minute: t%60 }, allowWhileIdle: true },
          extra: { actId: a.id } });
      }
    }
    if (list.length) await LN.schedule({notifications: list});
  } catch(e){ console.error(e); toast('No se pudieron programar los avisos'); }
}
async function testReminder(){
  if (!LN){ toast('La prueba funciona en la app del celular'); return; }
  if (notif.perm !== 'granted'){ await enableReminders(); if (notif.perm !== 'granted') return; }
  try { await LN.createChannel({id:'rumbo', name:'Recordatorios', importance:5, visibility:1, vibration:true}); } catch(e){}
  await LN.schedule({notifications:[{id: 99999, channelId:'rumbo', title:'Así se ve un recordatorio', body:'Rumbo te avisará antes de cada actividad.', schedule:{at: new Date(Date.now()+5000), allowWhileIdle:true}}]});
  toast('Llega en 5 segundos. Puedes bloquear el celular.');
}
function pruneLog(){
  const cutoff = dkey(addDays(new Date(), -90));
  for (const k of Object.keys(S.log)) if (k < cutoff) delete S.log[k];
}
function renderSync(){
  const el = $('#sync'); if (!el) return;

/* ---------- versión web: instalar y avisos por calendario ---------- */
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(UA);
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const APK_URL = 'https://github.com/alkam7/rumbo/releases/latest/download/Rumbo.apk';
const IOS_SHARE = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11v9h12v-9"/></svg>';

function webCard(){
  if (IS_ANDROID && !STANDALONE)
    return '<div class="remind-card"><p><b>¿Tienes Android?</b> Instala la app de Rumbo: los recordatorios suenan aunque esté cerrada.</p><div class="actions"><a class="btn primary sm" href="'+APK_URL+'" style="text-decoration:none">Descargar app para Android</a></div><p style="font-size:12.5px;color:var(--muted)">Al abrir el archivo, permite instalar desde esta fuente.</p></div>';
  if (IS_IOS && !STANDALONE)
    return '<div class="remind-card"><p><b>Instálala en tu iPhone.</b> En Safari toca '+IOS_SHARE+' <b>Compartir</b> y luego <b>Agregar a inicio</b>. Queda como una app más.</p></div>';
  if (!S.icsAt)
    return '<div class="remind-card"><p><b>Activa tus avisos.</b> Rumbo pone tus actividades en el calendario del celular con alarma, así te avisa aunque la app esté cerrada.</p><div class="actions"><button class="btn primary sm" data-ics>Agregar avisos al calendario</button></div></div>';
  return '';
}
const icsEsc = s => String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
const icsDT = d => d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
function buildICS(){
  const BY = ['SU','MO','TU','WE','TH','FR','SA'], now = new Date();
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rumbo//Agenda//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Rumbo'];
  for (const a of S.activities){
    if (!a.days.length) continue;
    let first = dayOnly(now); for (let i = 0; i < 7 && !a.days.includes(first.getDay()); i++) first = addDays(first, 1);
    const s = new Date(first); s.setMinutes(toMin(a.start));
    const e = new Date(s.getTime() + durMin(a)*60000);
    L.push('BEGIN:VEVENT','UID:rumbo-'+a.id+'@rumbo.app','DTSTAMP:'+stamp,'DTSTART:'+icsDT(s),'DTEND:'+icsDT(e),
      'RRULE:FREQ=WEEKLY;BYDAY='+a.days.map(d=>BY[d]).join(','),'SUMMARY:'+icsEsc(a.title),'DESCRIPTION:'+icsEsc(reminderText(a)));
    if (a.remind !== null && a.remind !== undefined)
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(a.title),'TRIGGER:-PT'+a.remind+'M','END:VALARM');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n') + '\r\n';
}
function exportICS(){
  const blob = new Blob([buildICS()], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'rumbo-avisos.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  S.icsAt = Date.now(); save(); render();
  toast(IS_IOS ? 'Toca "Agregar todo" para guardarlos en Calendario' : 'Abre el archivo para agregarlo a tu calendario');
}

/* ---------- consultas ---------- */
const actsFor = d => S.activities.filter(a => a.days.includes(d.getDay())).sort((a,b) => toMin(a.start) - toMin(b.start));
const entry = (d, id) => { const k = dkey(d); S.log[k] ??= {}; S.log[k][id] ??= {}; return S.log[k][id]; };
const peek = (d, id) => (S.log[dkey(d)] || {})[id] || {};
const actById = id => S.activities.find(a => a.id === id);
const routine = id => S.routines.find(r => r.id === id);
const klass = id => S.classes.find(c => c.id === id);
function dayStats(d){ const acts = actsFor(d); const done = acts.filter(a => peek(d,a.id).done).length; return {total: acts.length, done}; }
function isNow(a){ const n = nowMin(), s = toMin(a.start); let e = toMin(a.end); if (e <= s) e += 1440; return n >= s && n < e; }
function routineOf(d,a){ return routine(peek(d,a.id).routineId || a.pref?.routineId); }
function classOf(d,a){ return klass(peek(d,a.id).classId || a.pref?.classId); }

function chipFor(d, a){
  const e = peek(d, a.id);
  if (a.type === 'gym'){ const r = routineOf(d,a); if (!r) return ['Elige tu rutina', true];
    const n = r.ex.filter((_,i) => e.ex?.[i]).length; return ['Rutina: '+r.name + (n ? ' · '+n+'/'+r.ex.length : ''), false]; }
  if (a.type === 'clase'){ const c = classOf(d,a); if (!c) return ['¿En qué clase estás?', true];
    return [c.name + (c.room ? ' · '+c.room : ''), false]; }
  if (a.type === 'trabajo'){ const p = (e.prio||[]).filter(x => x && x.t); if (!p.length) return ['Define tus 3 prioridades', true];
    return [p.filter(x => x.ok).length+'/'+p.length+' prioridades', false]; }
  if (a.type === 'dormir'){ const n = SLEEP_CHECKS.filter((_,i) => e.sl?.[i]).length; return [n ? 'Rutina de descanso '+n+'/'+SLEEP_CHECKS.length : 'Rutina de descanso', !n]; }
  if (e.goal) return [e.goal, false];
  return ['Ponle un objetivo', true];
}

/* ---------- vistas ---------- */
let view = 'hoy', sel = dayOnly(new Date());

function render(){

function viewHoy(){
  const acts = actsFor(sel), st = dayStats(sel), today = isToday(sel);
  const pct = st.total ? st.done / st.total : 0, C = 2*Math.PI*26;
  let nextHtml = '';
  if (today){
    const n = nowMin(); const cur = acts.find(isNow); const nx = acts.find(a => toMin(a.start) > n);
    if (cur && !peek(sel,cur.id).done) nextHtml = '<div class="next"><span class="lbl">Ahora</span><strong>'+esc(cur.title)+'</strong><span style="flex:1"></span><span class="pill" id="focusPill" hidden></span></div>';
    else if (nx) { const m = toMin(nx.start) - n; nextHtml = '<div class="next"><span class="lbl">Siguiente</span><strong>'+esc(nx.title)+'</strong><span style="flex:1"></span><span class="pill">en '+fmtDur(m)+'</span></div>'; }
    else nextHtml = '<div class="next"><span class="lbl">Lo que queda del día está libre.</span></div>';
  }
  const ws = weekStart(sel);
  const strip = [0,1,2,3,4,5,6].map(i => { const d = addDays(ws,i), s = dayStats(d);
    return '<button data-day="'+dkey(d)+'" class="'+(isToday(d)?'today':'')+'" '+(dkey(d)===dkey(sel)?'aria-current="date"':'')+'><span class="d">'+DL[d.getDay()]+'</span><span class="n">'+d.getDate()+'</span><span class="bar"><u style="width:'+(s.total? Math.round(s.done/s.total*100):0)+'%"></u></span></button>'; }).join('');

  let list = '', placedNow = !today;
  const n = nowMin();
  acts.forEach(a => {
    if (!placedNow && toMin(a.start) > n){ list += nowLine(); placedNow = true; }
    const e = peek(sel, a.id), f = fmtT(a.start), [chip, empty] = chipFor(sel, a);
    const now = today && isNow(a);
    list += '<li class="item'+(e.done?' done':'')+(now?' now':'')+'" style="--cat:'+cat(a.type)+'">'+
      '<div class="when"><span class="t">'+f.t+'</span><span class="p">'+f.p+'</span></div>'+
      '<button class="card" data-open="'+a.id+'"><span class="ico">'+ico(a.type)+'</span><span class="body">'+
        '<span class="title">'+esc(a.title)+(now?'<span class="tag-now">ahora</span>':'')+'</span>'+
        '<span class="meta">'+fmtFull(a.start)+' – '+fmtFull(a.end)+' · '+fmtDur(durMin(a))+'</span>'+
        '<span class="chip'+(empty?' empty':'')+'">'+esc(chip)+'</span></span></button>'+
      '<button class="check" data-done="'+a.id+'" aria-pressed="'+!!e.done+'" aria-label="Marcar '+esc(a.title)+' como hecha">'+ICON_CHECK+'</button></li>';
  });
  if (!placedNow && acts.length) list += nowLine();

  return '<header class="top"><div class="date"><div class="eyebrow">'+(today?'Hoy':DN[sel.getDay()])+'</div>'+
      '<h1>'+DN[sel.getDay()].replace(/^./, c=>c.toUpperCase())+' '+sel.getDate()+' <span>'+MN[sel.getMonth()]+'</span></h1></div>'+
      '<div class="ring" title="Actividades hechas"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="var(--line)" stroke-width="5"/>'+
      '<circle cx="30" cy="30" r="26" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg><b>'+st.done+'/'+st.total+'</b></div></header>'+
    nextHtml + '<div class="sync" id="sync"></div>' + remindCard() +
    '<nav class="strip" aria-label="Días de la semana">'+strip+'</nav>'+
    (acts.length ? '<ol class="timeline">'+list+'</ol>' : '<div class="empty-day">No tienes nada programado el '+DN[sel.getDay()]+'.<br>Toca <b>+</b> para agregar tu primera actividad.</div>');
}
function nowLine(){ const n = new Date(); const f = fmtT(n.getHours()+':'+n.getMinutes()); return '<li class="nowline" aria-hidden="true"><span>'+f.t+'</span><i></i></li>'; }

function viewSemana(){
  const ws = weekStart(new Date()); let tot = 0, done = 0, focus = 0, gym = 0, good = 0;
  const rows = [0,1,2,3,4,5,6].map(i => { const d = addDays(ws,i), acts = actsFor(d), s = dayStats(d);
    tot += s.total; done += s.done; if (s.total && s.done/s.total >= .8) good++;
    acts.forEach(a => { const e = peek(d,a.id); focus += e.focus||0; if (a.type==='gym' && e.done) gym++; });
    const segs = acts.map(a => '<i class="'+(peek(d,a.id).done?'on':'')+'" style="--cat:'+cat(a.type)+'"></i>').join('') || '<i></i>';
    return '<button class="dayrow'+(isToday(d)?' is-today':'')+'" data-goto="'+dkey(d)+'"><span class="nm">'+DN[d.getDay()].replace(/^./,c=>c.toUpperCase())+'<small>'+d.getDate()+' '+MN[d.getMonth()]+'</small></span><span class="segs">'+segs+'</span><span class="ct">'+s.done+'/'+s.total+'</span></button>';
  }).join('');
  let streak = 0; for (let i = 0; i < 90; i++){ const d = addDays(new Date(), -i), s = dayStats(d);
    if (!s.total) continue; if (s.done/s.total >= .8) streak++; else if (i === 0) continue; else break; }
  const we = addDays(ws,6);
  return '<header class="page-h"><div class="eyebrow">Semana del '+ws.getDate()+' '+MN[ws.getMonth()]+' al '+we.getDate()+' '+MN[we.getMonth()]+'</div><h1>Tu semana</h1></header>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+(tot?Math.round(done/tot*100):0)+'%</b><span>de lo planeado, hecho</span></div>'+
      '<div class="stat"><b>'+streak+'</b><span>'+(streak===1?'día':'días')+' de racha (80% o más)</span></div>'+
      '<div class="stat"><b>'+fmtDur(focus)+'</b><span>de enfoque medido</span></div>'+
      '<div class="stat"><b>'+gym+'</b><span>'+(gym===1?'entrenamiento':'entrenamientos')+'</span></div></div>'+
    '<div class="days-list">'+rows+'</div>'+
    '<p class="note" style="margin-top:14px">Un día cuenta para la racha cuando cumples al menos el 80% de lo que programaste. Toca un día para abrirlo.</p>';
}

    '<section class="lib-sec"><div class="hd"><h3>Rutinas de gym</h3><button class="link" data-edit-routine="">+ Nueva</button></div><div class="list">'+(rs||'<div class="row">Aún no tienes rutinas.</div>')+'</div></section>'+
    '<section class="lib-sec"><div class="hd"><h3>Mis clases</h3><button class="link" data-edit-class="">+ Nueva</button></div><div class="list">'+(cs||'<div class="row">Aún no tienes clases.</div>')+'</div></section>'+
    '<p class="note">Las rutinas y clases de ejemplo están para que veas cómo funciona. Edítalas o bórralas y pon las tuyas.</p>';
}

/* ---------- hoja inferior ---------- */
let sheet = null; // {kind, id}
function openSheet(s){ sheet = s; const sc = $('#scrim'), sh = $('#sheet'); sc.hidden = sh.hidden = false; renderSheet();
  requestAnimationFrame(() => { sc.classList.add('open'); sh.classList.add('open'); }); }
function closeSheet(){ const sc = $('#scrim'), sh = $('#sheet'); sc.classList.remove('open'); sh.classList.remove('open'); sheet = null;
  setTimeout(() => { if (!sheet){ sc.hidden = sh.hidden = true; } }, 260); render(); }
function renderSheet(){
  if (!sheet) return;
  const k = sheet.kind, h = k === 'act' ? sheetAct() : k === 'edit' ? sheetEdit() : k === 'routine' ? sheetRoutine() : sheetClass();
  $('#sheetIn').innerHTML = '<div class="grab"></div>' + h; tick();
}

function sheetAct(){
  const a = actById(sheet.id); if (!a){ sheet = null; return ''; }
  const e = peek(sel, a.id); let body = '';
  if (a.type === 'gym'){
    const r = routineOf(sel,a);
    body += '<div class="sec"><h3>¿Qué rutina toca hoy?</h3><div class="chips">'+
      S.routines.map(x => '<button data-pick-routine="'+x.id+'" aria-pressed="'+(r&&r.id===x.id)+'">'+esc(x.name)+'</button>').join('')+
      '<button class="add" data-edit-routine="">+ Rutina</button></div></div>';
    if (r){ const n = r.ex.filter((_,i)=>e.ex?.[i]).length;
      body += '<div class="sec"><div class="info"><span><b>'+n+'/'+r.ex.length+'</b> ejercicios</span><button class="link" data-edit-routine="'+r.id+'">Editar rutina</button></div>'+
      '<div class="progress"><u style="width:'+(r.ex.length?n/r.ex.length*100:0)+'%"></u></div><div class="list">'+
      r.ex.map((x,i) => '<div class="row'+(e.ex?.[i]?' ok':'')+'"><input type="checkbox" id="ex'+i+'" data-ex="'+i+'" '+(e.ex?.[i]?'checked':'')+'><label for="ex'+i+'">'+esc(x)+'</label></div>').join('')+'</div></div>'; }
  } else if (a.type === 'clase'){
    const c = classOf(sel,a);
    body += '<div class="sec"><h3>¿En qué clase estás?</h3><div class="chips">'+
      S.classes.map(x => '<button data-pick-class="'+x.id+'" aria-pressed="'+(c&&c.id===x.id)+'">'+esc(x.name)+'</button>').join('')+
      '<button class="add" data-edit-class="">+ Clase</button></div>'+
      (c ? '<div class="info">'+(c.room?'<span>Aula <b>'+esc(c.room)+'</b></span>':'')+(c.who?'<span>Profesor <b>'+esc(c.who)+'</b></span>':'')+'<button class="link" data-edit-class="'+c.id+'">Editar clase</button></div>' : '')+'</div>';
    body += '<label class="field"><span>Tema de hoy</span><input type="text" id="f-topic" data-field="topic" value="'+esc(e.topic)+'" placeholder="Ej. Derivadas parciales"></label>'+
      '<div class="sec"><h3>Tarea o pendiente</h3><div class="list"><div class="row'+(e.hwDone?' ok':'')+'"><input type="checkbox" id="hwDone" data-flag="hwDone" '+(e.hwDone?'checked':'')+' aria-label="Tarea entregada"><input type="text" id="f-hw" data-field="hw" value="'+esc(e.hw)+'" placeholder="Ej. Ejercicios 1 al 10 para el lunes"></div></div></div>';
  } else if (a.type === 'trabajo'){
    const p = e.prio || [];
    body += '<div class="sec"><h3>Tus 3 prioridades del turno</h3><p class="hint">Lo que sí o sí tiene que salir hoy. Empieza por la primera.</p><div class="list">'+
      [0,1,2].map(i => '<div class="row'+(p[i]?.ok?' ok':'')+'"><input type="checkbox" id="pr'+i+'" data-prio-ok="'+i+'" '+(p[i]?.ok?'checked':'')+' aria-label="Prioridad '+(i+1)+' hecha"><input type="text" id="pt'+i+'" data-prio="'+i+'" value="'+esc(p[i]?.t)+'" placeholder="Prioridad '+(i+1)+'"></div>').join('')+'</div></div>';
  } else if (a.type === 'dormir'){
    body += '<div class="sec"><h3>Rutina de descanso</h3><p class="hint">Dormir bien es lo que hace posible el día de mañana.</p><div class="list">'+
      SLEEP_CHECKS.map((x,i) => '<div class="row'+(e.sl?.[i]?' ok':'')+'"><input type="checkbox" id="sl'+i+'" data-sl="'+i+'" '+(e.sl?.[i]?'checked':'')+'><label for="sl'+i+'">'+x+'</label></div>').join('')+'</div></div>'+
      '<label class="field"><span>Lo mejor que hice hoy</span><input type="text" id="f-win" data-field="win" value="'+esc(e.win)+'" placeholder="Una línea basta"></label>';
  } else {
    body += '<label class="field"><span>Objetivo de este bloque</span><input type="text" id="f-goal" data-field="goal" value="'+esc(e.goal)+'" placeholder="Ej. Terminar el resumen del capítulo 3"></label>';
  }
  if (a.type !== 'dormir') body += '<label class="field"><span>Notas</span><textarea id="f-notes" data-field="notes" placeholder="Algo que quieras recordar">'+esc(e.notes)+'</textarea></label>';
  if (a.type !== 'dormir'){
    const running = focus && focus.id === a.id;
    body += '<div class="sec"><h3>Bloque de enfoque</h3><div class="focus"><span class="clock" data-clock>'+(running?'':String(focusLen).padStart(2,'0')+':00')+'</span>'+
      (running ? '<button class="btn sm" data-focus-stop>Detener</button>' :
       '<div class="chips">'+[25,50].map(m=>'<button data-focus-len="'+m+'" aria-pressed="'+(focusLen===m)+'">'+m+'</button>').join('')+'</div><button class="btn sm primary" data-focus-start>Iniciar</button>')+
      '</div>'+(e.focus?'<p class="hint" style="margin-top:0">Hoy llevas '+fmtDur(e.focus)+' de enfoque en este bloque.</p>':'')+'</div>';
  }
  return '<div class="sh-head" style="--cat:'+cat(a.type)+'"><span class="ico">'+ico(a.type)+'</span><div class="grow"><h2>'+esc(a.title)+'</h2><div class="meta">'+DN[sel.getDay()]+' · '+fmtFull(a.start)+' – '+fmtFull(a.end)+'</div></div><button class="link" data-edit-act="'+a.id+'">Editar</button></div>'+
    '<div style="--cat:'+cat(a.type)+';display:flex;flex-direction:column;gap:18px">'+body+'</div>'+
    '<button class="btn block '+(e.done?'':'primary')+'" data-done="'+a.id+'">'+(e.done?'Hecha · tocar para desmarcar':'Marcar como hecha')+'</button>';
}

function sheetEdit(){
  const a = sheet.draft;
  return '<div class="sh-head"><div class="grow"><h2>'+(sheet.id?'Editar actividad':'Nueva actividad')+'</h2></div><button class="link" data-close>Cancelar</button></div>'+
    '<label class="field"><span>Nombre</span><input type="text" id="e-title" data-draft="title" value="'+esc(a.title)+'" placeholder="Ej. Entrenar, Clase de inglés, Trabajo"></label>'+
    '<div class="sec"><h3>Tipo</h3><div class="chips">'+Object.keys(TYPES).map(t=>'<button data-draft-type="'+t+'" aria-pressed="'+(a.type===t)+'">'+TYPES[t].label+'</button>').join('')+'</div></div>'+
    '<div class="two"><label class="field"><span>Empieza</span><input type="time" id="e-start" data-draft="start" value="'+a.start+'"></label><label class="field"><span>Termina</span><input type="time" id="e-end" data-draft="end" value="'+a.end+'"></label></div>'+
    '<div class="sec"><h3>Se repite</h3><div class="days">'+ORDER.map(d=>'<button data-draft-day="'+d+'" aria-pressed="'+a.days.includes(d)+'" aria-label="'+DN[d]+'">'+DL[d]+'</button>').join('')+'</div></div>'+
    '<div class="sec"><h3>Recordatorio</h3><div class="chips">'+REMIND_OPTS.map(([v,l])=>'<button data-draft-remind="'+(v===null?'off':v)+'" aria-pressed="'+((a.remind??null)===v)+'">'+l+'</button>').join('')+'</div></div>'+
    '<div class="actions">'+(sheet.id?'<button class="btn danger" data-del-act>'+(sheet.confirm?'¿Seguro? Borrar':'Borrar')+'</button>':'')+'<button class="btn primary" data-save-act>Guardar</button></div>';
}
function sheetRoutine(){
  const r = sheet.draft;
  return '<div class="sh-head" style="--cat:var(--c-gym)"><span class="ico">'+ico('gym')+'</span><div class="grow"><h2>'+(sheet.id?'Editar rutina':'Nueva rutina')+'</h2></div><button class="link" data-close>Cancelar</button></div>'+
    '<label class="field"><span>Nombre de la rutina</span><input type="text" id="r-name" data-rdraft="name" value="'+esc(r.name)+'" placeholder="Ej. Pierna, Torso, Full body"></label>'+
    '<label class="field"><span>Ejercicios (uno por línea)</span><textarea id="r-ex" data-rdraft="ex" style="min-height:150px" placeholder="Sentadilla 4×8&#10;Prensa 3×12">'+esc(r.ex)+'</textarea></label>'+
    '<div class="actions">'+(sheet.id?'<button class="btn danger" data-del-routine>'+(sheet.confirm?'¿Seguro? Borrar':'Borrar')+'</button>':'')+'<button class="btn primary" data-save-routine>Guardar</button></div>';
}
function sheetClass(){
  const c = sheet.draft;
  return '<div class="sh-head" style="--cat:var(--c-clase)"><span class="ico">'+ico('clase')+'</span><div class="grow"><h2>'+(sheet.id?'Editar clase':'Nueva clase')+'</h2></div><button class="link" data-close>Cancelar</button></div>'+
    '<label class="field"><span>Materia</span><input type="text" id="c-name" data-cdraft="name" value="'+esc(c.name)+'" placeholder="Ej. Historia"></label>'+
    '<div class="two"><label class="field"><span>Aula</span><input type="text" id="c-room" data-cdraft="room" value="'+esc(c.room)+'" placeholder="Ej. 204"></label>'+
    '<label class="field"><span>Profesor</span><input type="text" id="c-who" data-cdraft="who" value="'+esc(c.who)+'" placeholder="Opcional"></label></div>'+
    '<div class="actions">'+(sheet.id?'<button class="btn danger" data-del-class>'+(sheet.confirm?'¿Seguro? Borrar':'Borrar')+'</button>':'')+'<button class="btn primary" data-save-class>Guardar</button></div>';
}

/* ---------- enfoque ---------- */
let focus = null, focusLen = 25;
function tick(){
  const pill = $('#focusPill');
  if (!focus){ if (pill) pill.hidden = true; return; }
  const left = Math.max(0, focus.end - Date.now()), m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
  const txt = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  document.querySelectorAll('[data-clock]').forEach(el => { if (sheet && sheet.id === focus.id) el.textContent = txt; });
  if (pill){ pill.hidden = false; pill.textContent = 'enfoque '+txt; }
  if (left <= 0){
    const d = new Date(focus.date+'T12:00'); const e = entry(d, focus.id); e.focus = (e.focus||0) + focus.mins; save();
    toast('Bloque de enfoque completo: +'+focus.mins+' min'); try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(_){}
    focus = null; sheet ? renderSheet() : render();
  }
}
setInterval(tick, 1000);
setInterval(() => { if (view === 'hoy' && !sheet && isToday(sel)) render(); }, 60000);

/* ---------- toast ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('button, [data-close]');
  if (ev.target.id === 'scrim'){ closeSheet(); return; }
  if (!b) return;
  const D = b.dataset;
  if (D.view){ view = D.view; if (sheet) closeSheet(); render(); window.scrollTo(0,0); return; }
  if (D.day){ sel = new Date(D.day+'T00:00'); render(); return; }
  if (D.goto){ sel = new Date(D.goto+'T00:00'); view = 'hoy'; render(); window.scrollTo(0,0); return; }
  if (D.open){ openSheet({kind:'act', id:D.open}); return; }
  if ('close' in D){ closeSheet(); return; }
  if (D.done){ const e = entry(sel, D.done); e.done = !e.done; save();
    if (e.done){ const st = dayStats(sel); toast(st.done === st.total ? 'Día completo. Bien hecho.' : 'Hecha · '+st.done+' de '+st.total); }
    sheet ? closeSheet() : render(); return; }
  if (D.pickRoutine){ const a = actById(sheet.id); entry(sel,a.id).routineId = D.pickRoutine; if (entry(sel,a.id).routineId !== D.pickRoutine) {}
    entry(sel,a.id).ex = {}; a.pref = {...(a.pref||{}), routineId:D.pickRoutine}; save(); renderSheet(); return; }
  if (D.pickClass){ const a = actById(sheet.id); entry(sel,a.id).classId = D.pickClass; a.pref = {...(a.pref||{}), classId:D.pickClass}; save(); renderSheet(); return; }
  if (D.focusLen){ focusLen = +D.focusLen; renderSheet(); return; }
  if ('focusStart' in D){ focus = {id:sheet.id, date:dkey(sel), mins:focusLen, end:Date.now()+focusLen*60000}; renderSheet(); toast('Enfoque de '+focusLen+' min. Guarda el celular.'); return; }
  if ('focusStop' in D){ focus = null; renderSheet(); return; }

  // actividades
  if ('new' in D){ openSheet({kind:'edit', id:null, draft:{title:'', type:'otro', start:'09:00', end:'10:00', days:[sel.getDay()], remind:10}}); return; }
  if (D.editAct){ const a = actById(D.editAct); openSheet({kind:'edit', id:a.id, back:a.id, draft:{...a, days:a.days.slice()}}); return; }
  if (D.draftType){ syncDraft(); sheet.draft.type = D.draftType; if (!sheet.draft.title.trim()) {} renderSheet(); return; }
  if (D.draftRemind){ syncDraft(); sheet.draft.remind = D.draftRemind === 'off' ? null : +D.draftRemind; renderSheet(); return; }
  if ('remindOn' in D){ enableReminders(); return; }
  if ('ics' in D){ exportICS(); return; }
  if ('remindTest' in D){ testReminder(); return; }
  if ('exact' in D){ LN && LN.changeExactNotificationSetting().then(refreshNotifState).catch(()=>{}); return; }
  if (D.draftDay){ syncDraft(); const d = +D.draftDay, ds = sheet.draft.days; const i = ds.indexOf(d); i >= 0 ? ds.splice(i,1) : ds.push(d); renderSheet(); return; }
  if ('saveAct' in D){ syncDraft(); const dr = sheet.draft;
    if (!dr.title.trim()) dr.title = TYPES[dr.type].label;
    if (!dr.days.length){ toast('Elige al menos un día'); return; }
    if (sheet.id){ Object.assign(actById(sheet.id), dr); } else { S.activities.push({...dr, id:uid()}); }
    save(); const back = sheet.back; toast('Guardado');
    if (back){ sheet = {kind:'act', id:back}; renderSheet(); } else closeSheet(); return; }
  if ('delAct' in D){ if (!sheet.confirm){ syncDraft(); sheet.confirm = true; renderSheet(); return; }
    S.activities = S.activities.filter(a => a.id !== sheet.id); save(); toast('Actividad borrada'); closeSheet(); return; }

  // rutinas
  if ('editRoutine' in D){ const r = D.editRoutine ? routine(D.editRoutine) : null;
    openSheet({kind:'routine', id:r?r.id:null, back:sheet&&sheet.kind==='act'?sheet.id:null, draft:{name:r?r.name:'', ex:r?r.ex.join('\n'):''}}); return; }
  if ('saveRoutine' in D){ syncDraft(); const dr = sheet.draft, ex = dr.ex.split('\n').map(s=>s.trim()).filter(Boolean);
    if (!dr.name.trim()){ toast('Ponle un nombre a la rutina'); return; }
    let id = sheet.id; if (id){ Object.assign(routine(id), {name:dr.name.trim(), ex}); } else { id = uid(); S.routines.push({id, name:dr.name.trim(), ex}); }
    if (sheet.back){ const a = actById(sheet.back); if (!sheet.id){ entry(sel,a.id).routineId = id; entry(sel,a.id).ex = {}; a.pref = {...(a.pref||{}), routineId:id}; } save(); sheet = {kind:'act', id:a.id}; renderSheet(); }
    else { save(); closeSheet(); } toast('Rutina guardada'); return; }
  if ('delRoutine' in D){ if (!sheet.confirm){ syncDraft(); sheet.confirm = true; renderSheet(); return; }
    S.routines = S.routines.filter(r => r.id !== sheet.id); save(); toast('Rutina borrada'); closeSheet(); return; }

  // clases
  if ('editClass' in D){ const c = D.editClass ? klass(D.editClass) : null;
    openSheet({kind:'class', id:c?c.id:null, back:sheet&&sheet.kind==='act'?sheet.id:null, draft:{name:c?c.name:'', room:c?c.room:'', who:c?c.who:''}}); return; }
  if ('saveClass' in D){ syncDraft(); const dr = sheet.draft;
    if (!dr.name.trim()){ toast('Ponle nombre a la clase'); return; }
    let id = sheet.id; const v = {name:dr.name.trim(), room:dr.room.trim(), who:dr.who.trim()};
    if (id) Object.assign(klass(id), v); else { id = uid(); S.classes.push({id, ...v}); }
    if (sheet.back){ const a = actById(sheet.back); if (!sheet.id){ entry(sel,a.id).classId = id; a.pref = {...(a.pref||{}), classId:id}; } save(); sheet = {kind:'act', id:a.id}; renderSheet(); }
    else { save(); closeSheet(); } toast('Clase guardada'); return; }
  if ('delClass' in D){ if (!sheet.confirm){ syncDraft(); sheet.confirm = true; renderSheet(); return; }
    S.classes = S.classes.filter(c => c.id !== sheet.id); save(); toast('Clase borrada'); closeSheet(); return; }
});

function syncDraft(){
  if (!sheet || !sheet.draft) return;
  document.querySelectorAll('#sheetIn [data-draft]').forEach(i => sheet.draft[i.dataset.draft] = i.value);
  document.querySelectorAll('#sheetIn [data-rdraft]').forEach(i => sheet.draft[i.dataset.rdraft] = i.value);
  document.querySelectorAll('#sheetIn [data-cdraft]').forEach(i => sheet.draft[i.dataset.cdraft] = i.value);
}

document.addEventListener('change', ev => {
  const t = ev.target, D = t.dataset;
  if ('remindToggle' in D){
    if (t.checked) enableReminders();
    else { S.remindOn = false; save(); scheduleAll(); render(); toast('Recordatorios apagados'); }
    return; }
  if (!sheet || sheet.kind !== 'act') return;
  const a = actById(sheet.id), e = entry(sel, a.id);
  if (D.ex !== undefined){ e.ex ??= {}; e.ex[D.ex] = t.checked; const r = routineOf(sel,a);
    if (r && r.ex.length && r.ex.every((_,i) => e.ex[i]) && !e.done){ e.done = true; toast('Rutina completa: '+r.name); }
    save(); renderSheet(); return; }
  if (D.sl !== undefined){ e.sl ??= {}; e.sl[D.sl] = t.checked; save(); renderSheet(); return; }
  if (D.prioOk !== undefined){ e.prio ??= []; e.prio[D.prioOk] = {...(e.prio[D.prioOk]||{t:''}), ok:t.checked}; save(); renderSheet(); return; }
  if (D.flag){ e[D.flag] = t.checked; save(); renderSheet(); return; }
});
document.addEventListener('input', ev => {
  const t = ev.target, D = t.dataset; if (!sheet || sheet.kind !== 'act') return;
  const e = entry(sel, sheet.id);
  if (D.field){ e[D.field] = t.value; save(); }
  if (D.prio !== undefined){ e.prio ??= []; e.prio[D.prio] = {...(e.prio[D.prio]||{}), t:t.value}; save(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheet) closeSheet(); });

/* ---------- app nativa: botón atrás, volver a la app, tocar un aviso ---------- */
if (AppP){
  AppP.addListener('backButton', () => { if (sheet) closeSheet(); else if (view !== 'hoy'){ view = 'hoy'; render(); } else AppP.minimizeApp(); });
  AppP.addListener('resume', () => { if (!sheet) render(); refreshNotifState(); });
}
if (LN){
  LN.addListener('localNotificationActionPerformed', ev => {
    const id = ev.notification?.extra?.actId; if (!id || !actById(id)) return;
    sel = dayOnly(new Date()); view = 'hoy'; render(); openSheet({kind:'act', id});
  });
}

if (!NATIVE && 'serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
refreshNotifState().then(() => { if (S.remindOn && notif.perm === 'granted') scheduleAll(); });
</script>
</body>
</html>
